<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Order-level payment reconciliation</title>
  <desc id="desc">Payments and order items are aggregated separately to order level before their totals are compared.</desc>
  <rect width="1200" height="675" rx="28" fill="#f8fafc"/>
  <text x="70" y="75" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">Can we trust the reported transaction totals?</text>
  <text x="70" y="112" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="19">Reconcile at the order grain before joining one-to-many tables</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="165" width="250" height="116" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="195" y="208" text-anchor="middle" fill="#075985" font-size="18" font-weight="700">ORDER ITEMS</text>
    <text x="195" y="242" text-anchor="middle" fill="#334155" font-size="16">price + freight</text>
    <rect x="70" y="346" width="250" height="116" rx="18" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
    <text x="195" y="389" text-anchor="middle" fill="#115e59" font-size="18" font-weight="700">PAYMENT RECORDS</text>
    <text x="195" y="423" text-anchor="middle" fill="#334155" font-size="16">one or more per order</text>

    <rect x="435" y="165" width="250" height="116" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="560" y="208" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">AGGREGATE ITEMS</text>
    <text x="560" y="242" text-anchor="middle" fill="#64748b" font-size="16">one total per order</text>
    <rect x="435" y="346" width="250" height="116" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="560" y="389" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700">AGGREGATE PAYMENTS</text>
    <text x="560" y="423" text-anchor="middle" fill="#64748b" font-size="16">one total per order</text>

    <rect x="800" y="235" width="330" height="160" rx="22" fill="#0f2f3a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="965" y="280" text-anchor="middle" fill="#99f6e4" font-size="17" font-weight="700">ORDER-LEVEL COMPARISON</text>
    <text x="965" y="322" text-anchor="middle" fill="#ffffff" font-size="19">payment ≈ merchandise + freight</text>
    <text x="965" y="368" text-anchor="middle" fill="#5eead4" font-size="34" font-weight="750">99.58% match</text>
  </g>

  <g fill="none" stroke="#0ea5a4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 223h95"/><path d="m403 212 12 11-12 11"/>
    <path d="M320 404h95"/><path d="m403 393 12 11-12 11"/>
    <path d="M685 223h45c25 0 40 22 40 48v25c0 12 10 19 30 19"/>
    <path d="M685 404h45c25 0 40-22 40-48v-22c0-12 10-19 30-19"/>
    <path d="m788 304 12 11-12 11"/>
  </g>

  <rect x="70" y="520" width="1060" height="90" rx="18" fill="#fff7ed" stroke="#fdba74"/>
  <text x="100" y="556" fill="#9a3412" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">WHY THIS MATTERS</text>
  <text x="100" y="586" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="17">Joining item rows directly to payment rows can multiply values. Separate aggregation keeps the reported metrics reliable.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Rolling validation with a 90-day purge gap</title><desc id="desc">Three validation months and one final test month, each separated from training labels by a 90-day gap.</desc><rect width="1200" height="675" rx="28" fill="#261605"/><text x="70" y="78" fill="#fbbf24" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">Q2 · TEMPORAL VALIDATION</text><text x="70" y="133" fill="#fffbeb" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">Labels mature before every scoring date</text>
  <g font-family="Inter,Arial,sans-serif"><text x="75" y="202" fill="#d6b477" font-size="15">SPLIT</text><text x="240" y="202" fill="#d6b477" font-size="15">EXPANDING TRAINING SNAPSHOTS</text><text x="735" y="202" fill="#d6b477" font-size="15">90-DAY PURGE</text><text x="995" y="202" fill="#d6b477" font-size="15">SCORE</text>
    <text x="75" y="270" fill="#fff" font-size="19">Validation 1</text><rect x="240" y="245" width="390" height="34" rx="9" fill="#f59e0b"/><rect x="630" y="245" width="270" height="34" rx="9" fill="#6a4518"/><rect x="900" y="240" width="16" height="44" rx="8" fill="#fff"/><text x="950" y="270" fill="#fff" font-size="18">Mar 2011</text>
    <text x="75" y="355" fill="#fff" font-size="19">Validation 2</text><rect x="240" y="330" width="430" height="34" rx="9" fill="#f59e0b"/><rect x="670" y="330" width="230" height="34" rx="9" fill="#6a4518"/><rect x="900" y="325" width="16" height="44" rx="8" fill="#fff"/><text x="950" y="355" fill="#fff" font-size="18">May 2011</text>
    <text x="75" y="440" fill="#fff" font-size="19">Validation 3</text><rect x="240" y="415" width="500" height="34" rx="9" fill="#f59e0b"/><rect x="740" y="415" width="160" height="34" rx="9" fill="#6a4518"/><rect x="900" y="410" width="16" height="44" rx="8" fill="#fff"/><text x="950" y="440" fill="#fff" font-size="18">Jul 2011</text>
    <text x="75" y="525" fill="#fb7185" font-size="19" font-weight="750">Final test</text><rect x="240" y="500" width="570" height="34" rx="9" fill="#f59e0b"/><rect x="810" y="500" width="90" height="34" rx="9" fill="#6a4518"/><rect x="900" y="495" width="16" height="44" rx="8" fill="#fb7185"/><text x="950" y="525" fill="#fb7185" font-size="18" font-weight="750">Sep 2011</text></g>
  <text x="70" y="610" fill="#d6b477" font-family="Inter,Arial,sans-serif" font-size="17">No training snapshot is used until its full 90-day outcome window is known.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Point-in-time inactivity target design</title><desc id="desc">A 180-day feature window leads to a monthly customer snapshot and a 90-day no-purchase target.</desc><rect width="1200" height="675" rx="28" fill="#261605"/><text x="70" y="80" fill="#fbbf24" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">Q1 · TARGET DESIGN</text><text x="70" y="136" fill="#fffbeb" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">A precise proxy replaces an unsupported churn claim</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="70" y="210" width="300" height="270" rx="22" fill="#352006" stroke="#7c541f"/><text x="100" y="254" fill="#d6b477" font-size="15">OBSERVE · 180 DAYS</text><text x="100" y="305" fill="#fff" font-size="22" font-weight="700">Recency &amp; tenure</text><text x="100" y="345" fill="#fff" font-size="22" font-weight="700">Orders, spend &amp; units</text><text x="100" y="385" fill="#fff" font-size="22" font-weight="700">Cadence &amp; trend</text><text x="100" y="425" fill="#fff" font-size="22" font-weight="700">Products &amp; cancellations</text><rect x="450" y="210" width="300" height="270" rx="22" fill="#4a2c08" stroke="#fbbf24"/><text x="600" y="270" text-anchor="middle" fill="#fbbf24" font-size="15">MONTHLY SNAPSHOT</text><text x="600" y="338" text-anchor="middle" fill="#fff" font-size="42" font-weight="750">48,079</text><text x="600" y="372" text-anchor="middle" fill="#e4c799" font-size="18">customer-months</text><text x="600" y="425" text-anchor="middle" fill="#fef3c7" font-size="18">Customer ID excluded</text><rect x="830" y="210" width="300" height="270" rx="22" fill="#352006" stroke="#fb7185"/><text x="860" y="254" fill="#fb7185" font-size="15">OBSERVE · NEXT 90 DAYS</text><text x="980" y="335" text-anchor="middle" fill="#fff" font-size="52" font-weight="800">50.9%</text><text x="980" y="373" text-anchor="middle" fill="#e4c799" font-size="19">overall inactivity</text><text x="980" y="425" text-anchor="middle" fill="#fef3c7" font-size="18">No successful purchase</text></g>
  <path d="M385 345H430M765 345H810" stroke="#f59e0b" stroke-width="5"/><path d="M420 335l12 10-12 10M800 335l12 10-12 10" fill="none" stroke="#f59e0b" stroke-width="4"/><rect x="70" y="530" width="1060" height="70" rx="18" fill="#352006"/><text x="600" y="560" text-anchor="middle" fill="#fffbeb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Prediction target: 90-day purchase inactivity</text><text x="600" y="587" text-anchor="middle" fill="#d6b477" font-family="Inter,Arial,sans-serif" font-size="15">Not account closure, subscription termination, or permanent churn</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">E-commerce customer churn prediction</title>
  <desc id="desc">An amber machine-learning evaluation dashboard showing churn rate, F1, ROC-AUC, and leading predictive features.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#261605"/><stop offset="1" stop-color="#5a3710"/></linearGradient></defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="85" r="170" fill="#f59e0b" opacity=".1"/>
  <text x="72" y="86" fill="#fbbf24" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">PREDICTIVE ANALYTICS</text>
  <text x="72" y="145" fill="#fffbeb" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="750">Customer Churn Prediction</text>
  <text x="72" y="184" fill="#e4c799" font-family="Inter,Arial,sans-serif" font-size="22">Imbalance-aware evaluation · interpretable signals</text>
  <rect x="72" y="226" width="438" height="360" rx="24" fill="#352006" stroke="#7c541f"/>
  <text x="112" y="273" fill="#fef3c7" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">HELD-OUT RESULT</text>
  <circle cx="216" cy="406" r="86" fill="none" stroke="#69451a" stroke-width="22"/><circle cx="216" cy="406" r="86" fill="none" stroke="#f59e0b" stroke-width="22" stroke-linecap="round" stroke-dasharray="535 540" transform="rotate(-90 216 406)"/>
  <text x="216" y="398" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">ROC-AUC</text><text x="216" y="435" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="750" text-anchor="middle">0.9905</text>
  <text x="353" y="366" fill="#e4c799" font-family="Inter,Arial,sans-serif" font-size="17">F1 SCORE</text><text x="353" y="410" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">0.8715</text>
  <text x="353" y="467" fill="#e4c799" font-family="Inter,Arial,sans-serif" font-size="17">CHURN RATE</text><text x="353" y="511" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">16.84%</text>
  <rect x="546" y="226" width="582" height="360" rx="24" fill="#352006" stroke="#7c541f"/>
  <text x="586" y="273" fill="#fef3c7" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">LEADING PREDICTIVE FEATURES</text>
  <g font-family="Inter,Arial,sans-serif" font-size="17" fill="#f8e4bd">
    <text x="586" y="331">Satisfaction / tenure</text><rect x="586" y="345" width="460" height="20" rx="7" fill="#6a4518"/><rect x="586" y="345" width="426" height="20" rx="7" fill="#f59e0b"/>
    <text x="586" y="408">Tenure</text><rect x="586" y="422" width="460" height="20" rx="7" fill="#6a4518"/><rect x="586" y="422" width="422" height="20" rx="7" fill="#fbbf24"/>
    <text x="586" y="485">Order value</text><rect x="586" y="499" width="460" height="20" rx="7" fill="#6a4518"/><rect x="586" y="499" width="287" height="20" rx="7" fill="#fcd34d"/>
  </g>
  <text x="72" y="633" fill="#b9955d" font-family="Inter,Arial,sans-serif" font-size="16">5,630 customers · four models · four sampling strategies</text>
</svg>

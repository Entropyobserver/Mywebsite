<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">90-day purchase inactivity prediction</title><desc id="desc">A temporal customer-risk project with 48,079 customer-month observations, final PR-AUC 0.628, and 1.90 times Top-10-percent lift.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#261605"/><stop offset="1" stop-color="#5a3710"/></linearGradient><linearGradient id="risk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><circle cx="1090" cy="75" r="180" fill="#f59e0b" opacity=".09"/>
  <text x="72" y="84" fill="#fbbf24" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">TEMPORAL CUSTOMER RISK</text><text x="72" y="145" fill="#fffbeb" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="750">90-Day Purchase Inactivity</text><text x="72" y="187" fill="#e4c799" font-family="Inter,Arial,sans-serif" font-size="22">Monthly scoring · purge-gap validation · capacity-based targeting</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Top-10-percent targeting value</title><desc id="desc">The highest-risk 278 customers have 74.8 percent inactivity, 19.1 percent recall, and 1.90 times lift.</desc><rect width="1200" height="675" rx="28" fill="#261605"/><text x="70" y="78" fill="#fbbf24" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">Q5 · CAPACITY-BASED TARGETING</text><text x="70" y="133" fill="#fffbeb" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">The top-risk 10% concentrates inactivity</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="70" y="200" width="315" height="285" rx="22" fill="#352006" stroke="#fb7185"/><text x="100" y="245" fill="#fb7185" font-size="15">TOP-RISK CUSTOMERS</text><text x="100" y="330" fill="#fff" font-size="58" font-weight="800">278</text><text x="100" y="372" fill="#e4c799" font-size="18">10% of test customers</text><rect x="442" y="200" width="315" height="285" rx="22" fill="#352006" stroke="#fbbf24"/><text x="472" y="245" fill="#fbbf24" font-size="15">OBSERVED INACTIVITY</text><text x="472" y="330" fill="#fff" font-size="58" font-weight="800">74.8%</text><text x="472" y="372" fill="#e4c799" font-size="18">versus 39.3% overall</text><rect x="814" y="200" width="315" height="285" rx="22" fill="#352006" stroke="#f59e0b"/><text x="844" y="245" fill="#f59e0b" font-size="15">TARGETING LIFT</text><text x="844" y="330" fill="#fff" font-size="58" font-weight="800">1.90×</text><text x="844" y="372" fill="#e4c799" font-size="18">recall: 19.1%</text></g>
  <rect x="70" y="535" width="1060" height="70" rx="18" fill="#352006"/><text x="600" y="565" text-anchor="middle" fill="#fffbeb" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Use the list as an experiment candidate pool</text><text x="600" y="592" text-anchor="middle" fill="#d6b477" font-family="Inter,Arial,sans-serif" font-size="15">Incremental retention and ROI still require randomized outreach, margin, and treatment cost.</text></svg>

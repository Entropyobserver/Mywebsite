<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Human validation of SLIDE written-standard labels</title>
  <desc id="desc">A stratified 120-item review by one human reviewer shows moderate agreement with SLIDE and asymmetric strengths across Bokmål and Nynorsk labels.</desc>
  <rect width="1440" height="810" fill="#f8fafc"/>
  <text x="720" y="70" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="760">SLIDE is useful—but not a substitute for human review</text>
  <text x="720" y="110" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="20">Stratified validation sample · 120 outputs · one human reviewer</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="80" y="165" width="410" height="475" rx="24" fill="#0f172a"/>
    <text x="285" y="220" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="750">OVERALL AGREEMENT</text>
    <text x="285" y="315" text-anchor="middle" fill="white" font-size="68" font-weight="850">60.8%</text>
    <line x1="135" y1="360" x2="435" y2="360" stroke="#334155"/>
    <text x="155" y="420" fill="#94a3b8" font-size="17" font-weight="700">MACRO-F1</text>
    <text x="405" y="420" text-anchor="end" fill="#5eead4" font-size="28" font-weight="850">0.552</text>
    <text x="155" y="485" fill="#94a3b8" font-size="17" font-weight="700">COHEN'S KAPPA</text>
    <text x="405" y="485" text-anchor="end" fill="#5eead4" font-size="28" font-weight="850">0.478</text>
    <text x="285" y="570" text-anchor="middle" fill="#cbd5e1" font-size="18" font-weight="750">Moderate agreement</text>
    <rect x="540" y="165" width="820" height="475" rx="24" fill="white" stroke="#cbd5e1"/>
    <text x="950" y="218" text-anchor="middle" fill="#0f172a" font-size="26" font-weight="800">Where the diagnostic is strongest</text>
    <text x="620" y="300" fill="#334155" font-size="20" font-weight="750">Bokmål precision</text>
    <rect x="620" y="325" width="620" height="52" rx="10" fill="#e2e8f0"/>
    <rect x="620" y="325" width="558" height="52" rx="10" fill="#4f46e5"/>
    <text x="1260" y="360" fill="#3730a3" font-size="22" font-weight="850">0.900</text>
    <text x="620" y="445" fill="#334155" font-size="20" font-weight="750">Nynorsk recall</text>
    <rect x="620" y="470" width="620" height="52" rx="10" fill="#e2e8f0"/>
    <rect x="620" y="470" width="593" height="52" rx="10" fill="#14b8a6"/>
    <text x="1260" y="505" fill="#0f766e" font-size="22" font-weight="850">0.957</text>
    <text x="950" y="590" text-anchor="middle" fill="#64748b" font-size="18">Mixed and uncertain cases require the greatest caution</text>
  </g>
  <rect x="230" y="695" width="980" height="58" rx="29" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="720" y="731" text-anchor="middle" fill="#9a3412" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750">Reported evidence excludes AI-assisted annotation passes and does not estimate inter-reviewer reliability</text>
  <text x="720" y="790" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800">Use SLIDE for auditing output distributions; retain human review for ambiguous cases</text>
</svg>

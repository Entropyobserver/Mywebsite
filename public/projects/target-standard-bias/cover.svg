<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Target-standard bias from data filtering</title>
  <desc id="desc">A diagram showing mixed Norwegian training data passing through a Bokmål-oriented filter and producing a narrower target distribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#18233d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <circle cx="1240" cy="85" r="260" fill="#5b7cfa" opacity=".08"/>
  <circle cx="150" cy="760" r="300" fill="#2dd4bf" opacity=".06"/>
  <text x="90" y="112" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">RESPONSIBLE MACHINE TRANSLATION</text>
  <text x="90" y="190" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="760">When “cleaning” data</text>
  <text x="90" y="252" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="760">changes the target standard</text>
  <text x="92" y="304" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="25">Norwegian MT · Bokmål · Nynorsk · controlled LoRA experiments</text>

  <g transform="translate(90 382)" filter="url(#shadow)">
    <rect width="350" height="278" rx="28" fill="#172033" stroke="#334155" stroke-width="2"/>
    <text x="28" y="48" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Mixed training targets</text>
    <g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650">
      <rect x="28" y="78" width="294" height="48" rx="12" fill="#4561e8"/><text x="48" y="109" fill="white">Bokmål-like</text>
      <rect x="28" y="140" width="220" height="48" rx="12" fill="#16a394"/><text x="48" y="171" fill="white">Nynorsk-like</text>
      <rect x="28" y="202" width="155" height="48" rx="12" fill="#64748b"/><text x="48" y="233" fill="white">Ambiguous</text>
    </g>
  </g>

  <g transform="translate(505 430)">
    <path d="M0 90h190" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <path d="m176 67 32 23-32 23" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="0" width="130" height="54" rx="27" fill="#24304a" stroke="#5b7cfa"/>
    <text x="103" y="35" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">FILTER</text>
  </g>

  <g transform="translate(775 382)" filter="url(#shadow)">
    <rect width="575" height="278" rx="28" fill="#172033" stroke="#334155" stroke-width="2"/>
    <text x="30" y="48" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">What changed?</text>
    <g font-family="Inter,Arial,sans-serif">
      <g transform="translate(30 78)"><circle cx="22" cy="22" r="22" fill="#4561e8"/><text x="22" y="29" text-anchor="middle" fill="white" font-size="20" font-weight="800">1</text><text x="60" y="29" fill="#f1f5f9" font-size="23">Translation quality</text></g>
      <g transform="translate(30 137)"><circle cx="22" cy="22" r="22" fill="#4561e8"/><text x="22" y="29" text-anchor="middle" fill="white" font-size="20" font-weight="800">2</text><text x="60" y="29" fill="#f1f5f9" font-size="23">Written-standard behavior</text></g>
      <g transform="translate(30 196)"><circle cx="22" cy="22" r="22" fill="#16a394"/><text x="22" y="29" text-anchor="middle" fill="white" font-size="20" font-weight="800">3</text><text x="60" y="29" fill="#f1f5f9" font-size="23">What the metric rewards</text></g>
    </g>
  </g>
  <rect x="90" y="718" width="1260" height="3" rx="2" fill="url(#accent)"/>
  <text x="90" y="765" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="21">A controlled study of data intervention, model behavior, and evaluation validity</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Controlled experimental framework</title>
  <desc id="desc">Three dataset conditions are adapted with a fixed LoRA recipe across NLLB scales and evaluated with the same test protocol.</desc>
  <rect width="1440" height="810" fill="#f8fafc"/>
  <text x="720" y="70" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">Controlled experimental framework</text>
  <text x="720" y="108" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="20">Change the data condition; hold adaptation and evaluation constant</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="155" width="390" height="500" rx="26" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="265" y="205" text-anchor="middle" fill="#3730a3" font-size="25" font-weight="800">1 · DATA CONDITIONS</text>
    <g font-size="23" font-weight="700">
      <rect x="110" y="250" width="310" height="88" rx="18" fill="#fff" stroke="#c7d2fe"/><text x="265" y="286" text-anchor="middle" fill="#1e293b">Original</text><text x="265" y="316" text-anchor="middle" fill="#64748b" font-size="17" font-weight="500">mixed-standard corpus</text>
      <rect x="110" y="365" width="310" height="88" rx="18" fill="#fff" stroke="#818cf8" stroke-width="3"/><text x="265" y="401" text-anchor="middle" fill="#1e293b">Filtered</text><text x="265" y="431" text-anchor="middle" fill="#64748b" font-size="17" font-weight="500">Bokmål-oriented targets</text>
      <rect x="110" y="480" width="310" height="88" rx="18" fill="#fff" stroke="#c7d2fe"/><text x="265" y="516" text-anchor="middle" fill="#1e293b">Size-controlled</text><text x="265" y="546" text-anchor="middle" fill="#64748b" font-size="17" font-weight="500">separate identity from count</text>
    </g>
    <rect x="525" y="155" width="390" height="500" rx="26" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="720" y="205" text-anchor="middle" fill="#0e7490" font-size="25" font-weight="800">2 · FIXED ADAPTATION</text>
    <circle cx="720" cy="335" r="92" fill="#fff" stroke="#22d3ee" stroke-width="3"/>
    <text x="720" y="325" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="800">LoRA</text>
    <text x="720" y="359" text-anchor="middle" fill="#64748b" font-size="19">NLLB-200</text>
    <g fill="#164e63" font-size="20" font-weight="650">
      <text x="720" y="480" text-anchor="middle">same preprocessing contract</text>
      <text x="720" y="520" text-anchor="middle">same training recipe</text>
      <text x="720" y="560" text-anchor="middle">repeated across model scales</text>
    </g>
    <rect x="980" y="155" width="390" height="500" rx="26" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="1175" y="205" text-anchor="middle" fill="#15803d" font-size="25" font-weight="800">3 · SHARED EVALUATION</text>
    <g font-size="21" font-weight="650" fill="#14532d">
      <rect x="1025" y="250" width="300" height="64" rx="15" fill="#fff" stroke="#bbf7d0"/><text x="1175" y="291" text-anchor="middle">Translation quality</text>
      <rect x="1025" y="334" width="300" height="64" rx="15" fill="#fff" stroke="#bbf7d0"/><text x="1175" y="375" text-anchor="middle">Terminology</text>
      <rect x="1025" y="418" width="300" height="64" rx="15" fill="#fff" stroke="#bbf7d0"/><text x="1175" y="459" text-anchor="middle">Written-standard output</text>
      <rect x="1025" y="502" width="300" height="64" rx="15" fill="#fff" stroke="#bbf7d0"/><text x="1175" y="543" text-anchor="middle">FLORES robustness</text>
    </g>
  </g>
  <g stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M470 405h42"/><path d="m500 390 18 15-18 15"/>
    <path d="M925 405h42"/><path d="m955 390 18 15-18 15"/>
  </g>
  <rect x="210" y="708" width="1020" height="54" rx="27" fill="#0f172a"/>
  <text x="720" y="743" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Paired items + bootstrap uncertainty + diagnostic human review</text>
</svg>

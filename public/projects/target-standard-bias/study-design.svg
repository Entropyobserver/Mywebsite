<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Paper experimental design and dataset sizes</title>
  <desc id="desc">The original mixed corpus is compared with Bokmål-filtered and size-matched original-subsampled conditions before LoRA fine-tuning and evaluation.</desc>
  <rect width="1440" height="810" fill="#f8fafc"/>
  <text x="720" y="65" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">Data filtering as a controlled intervention</text>
  <text x="720" y="103" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="20">Exact corpus sizes and model conditions reported in the paper</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="80" y="150" width="350" height="470" rx="26" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="255" y="198" text-anchor="middle" fill="#3730a3" font-size="24" font-weight="800">DATA CONDITIONS</text>
    <g>
      <rect x="115" y="235" width="280" height="88" rx="16" fill="white" stroke="#c7d2fe"/>
      <text x="255" y="270" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="750">Original mixed</text>
      <text x="255" y="298" text-anchor="middle" fill="#64748b" font-size="17">13,935 / 1,737 / 1,742</text>
      <rect x="115" y="345" width="280" height="112" rx="16" fill="white" stroke="#6366f1" stroke-width="3"/>
      <text x="255" y="380" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="750">Bokmål-filtered</text>
      <text x="255" y="407" text-anchor="middle" fill="#4f46e5" font-size="16">NB ≥ 0.80 · NN &lt; 0.30</text>
      <text x="255" y="434" text-anchor="middle" fill="#64748b" font-size="17">10,114 / 1,305 / 1,313</text>
      <rect x="115" y="479" width="280" height="88" rx="16" fill="white" stroke="#c7d2fe"/>
      <text x="255" y="514" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="750">Original-subsampled</text>
      <text x="255" y="542" text-anchor="middle" fill="#64748b" font-size="17">10,114 / 1,305 / 1,313</text>
    </g>
    <rect x="545" y="150" width="350" height="470" rx="26" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="720" y="198" text-anchor="middle" fill="#0e7490" font-size="24" font-weight="800">LORA ADAPTATION</text>
    <circle cx="720" cy="325" r="94" fill="white" stroke="#22d3ee" stroke-width="3"/>
    <text x="720" y="313" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="800">NLLB-200</text>
    <text x="720" y="348" text-anchor="middle" fill="#0891b2" font-size="20">600M · 1.3B · 3.3B</text>
    <g fill="#164e63" font-size="19" font-weight="650">
      <text x="720" y="463" text-anchor="middle">r=8 · α=64 · dropout=0</text>
      <text x="720" y="500" text-anchor="middle">3 epochs · 3 seeds</text>
      <text x="720" y="537" text-anchor="middle">target code: nob_Latn</text>
    </g>
    <rect x="1010" y="150" width="350" height="470" rx="26" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="1185" y="198" text-anchor="middle" fill="#15803d" font-size="24" font-weight="800">EVALUATION</text>
    <g fill="#14532d" font-size="19" font-weight="700">
      <rect x="1048" y="235" width="274" height="58" rx="14" fill="white" stroke="#bbf7d0"/><text x="1185" y="271" text-anchor="middle">BLEU · chrF</text>
      <rect x="1048" y="311" width="274" height="58" rx="14" fill="white" stroke="#bbf7d0"/><text x="1185" y="347" text-anchor="middle">TermR · TermP · TermF1</text>
      <rect x="1048" y="387" width="274" height="58" rx="14" fill="white" stroke="#bbf7d0"/><text x="1185" y="423" text-anchor="middle">SLIDE standard labels</text>
      <rect x="1048" y="463" width="274" height="58" rx="14" fill="white" stroke="#bbf7d0"/><text x="1185" y="499" text-anchor="middle">FLORES NB / NN</text>
      <rect x="1048" y="539" width="274" height="58" rx="14" fill="white" stroke="#bbf7d0"/><text x="1185" y="575" text-anchor="middle">Blind human review</text>
    </g>
  </g>
  <g stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M447 385h78"/><path d="m511 370 18 15-18 15"/>
    <path d="M912 385h78"/><path d="m976 370 18 15-18 15"/>
  </g>
  <rect x="215" y="684" width="1010" height="62" rx="31" fill="#0f172a"/>
  <text x="720" y="723" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Size matching isolates target-standard filtering from reduced training volume</text>
</svg>

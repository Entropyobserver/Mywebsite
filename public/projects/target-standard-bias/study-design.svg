<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Three-dataset controlled experimental design</title>
  <desc id="desc">The study compares original mixed data, Bokmål-filtered data, and a same-size mixed subset. The filtered and same-size datasets have identical split sizes, isolating data selection from data volume.</desc>
  <rect width="1440" height="810" fill="#f8fafc"/>
  <text x="720" y="66" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="760">Three training datasets isolate the filtering effect</text>
  <text x="720" y="108" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="21">The controlled comparison separates which examples are selected from how many examples are used</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="175" width="380" height="355" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="70" y="175" width="380" height="72" rx="24" fill="#e2e8f0"/>
    <path d="M70 223h380v24H70z" fill="#e2e8f0"/>
    <text x="260" y="220" text-anchor="middle" fill="#0f172a" font-size="25" font-weight="800">Original mixed data</text>
    <text x="260" y="295" text-anchor="middle" fill="#334155" font-size="20" font-weight="700">Bokmål + Nynorsk</text>
    <text x="260" y="355" text-anchor="middle" fill="#64748b" font-size="17">TRAIN</text>
    <text x="260" y="398" text-anchor="middle" fill="#0f172a" font-size="34" font-weight="850">13,935</text>
    <text x="260" y="457" text-anchor="middle" fill="#64748b" font-size="17">VALID 1,737  ·  TEST 1,742</text>
    <text x="260" y="497" text-anchor="middle" fill="#475569" font-size="17">Original corpus distribution</text>

    <rect x="530" y="175" width="380" height="355" rx="24" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <rect x="530" y="175" width="380" height="72" rx="24" fill="#4f46e5"/>
    <path d="M530 223h380v24H530z" fill="#4f46e5"/>
    <text x="720" y="220" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">Bokmål-filtered data</text>
    <text x="720" y="295" text-anchor="middle" fill="#3730a3" font-size="20" font-weight="700">Mainly Bokmål</text>
    <text x="720" y="355" text-anchor="middle" fill="#6366f1" font-size="17">TRAIN</text>
    <text x="720" y="398" text-anchor="middle" fill="#312e81" font-size="34" font-weight="850">10,114</text>
    <text x="720" y="457" text-anchor="middle" fill="#6366f1" font-size="17">VALID 1,305  ·  TEST 1,313</text>
    <text x="720" y="497" text-anchor="middle" fill="#3730a3" font-size="17">Filtering condition</text>

    <rect x="990" y="175" width="380" height="355" rx="24" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="990" y="175" width="380" height="72" rx="24" fill="#0f766e"/>
    <path d="M990 223h380v24H990z" fill="#0f766e"/>
    <text x="1180" y="220" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="800">Same-size mixed subset</text>
    <text x="1180" y="295" text-anchor="middle" fill="#115e59" font-size="20" font-weight="700">Bokmål + Nynorsk</text>
    <text x="1180" y="355" text-anchor="middle" fill="#0f766e" font-size="17">TRAIN</text>
    <text x="1180" y="398" text-anchor="middle" fill="#134e4a" font-size="34" font-weight="850">10,114</text>
    <text x="1180" y="457" text-anchor="middle" fill="#0f766e" font-size="17">VALID 1,305  ·  TEST 1,313</text>
    <text x="1180" y="497" text-anchor="middle" fill="#115e59" font-size="17">Data-size control</text>

    <path d="M720 565v36h460v-36" fill="none" stroke="#0f172a" stroke-width="3"/>
    <circle cx="720" cy="565" r="6" fill="#4f46e5"/>
    <circle cx="1180" cy="565" r="6" fill="#0f766e"/>
    <rect x="475" y="612" width="710" height="78" rx="20" fill="#0f172a"/>
    <text x="830" y="647" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">Identical dataset sizes</text>
    <text x="830" y="675" text-anchor="middle" fill="#cbd5e1" font-size="18">Any difference between these models is attributable to data selection—not data volume</text>
  </g>
  <text x="720" y="760" text-anchor="middle" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750">All conditions use the same LoRA adaptation procedure</text>
</svg>

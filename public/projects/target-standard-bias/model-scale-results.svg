<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">RQ2 size-controlled replication across model scales</title>
  <desc id="desc">At 600M, 1.3B, and 3.3B parameters, models trained on the same number of sentence pairs produce substantially more Bokmål-only output when the selected examples are Bokmål-filtered.</desc>
  <rect width="1440" height="810" fill="#f8fafc"/>
  <text x="720" y="66" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="760">RQ2 · The shift comes from data selection—not less data</text>
  <text x="720" y="108" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="21">Within every model size, both systems use the same 10,114 training sentence pairs</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="80" y="165" width="1280" height="88" rx="22" fill="#0f172a"/>
    <rect x="135" y="194" width="24" height="24" rx="5" fill="#94a3b8"/>
    <text x="174" y="214" fill="#e2e8f0" font-size="18" font-weight="750">Same-size mixed</text>
    <rect x="370" y="194" width="24" height="24" rx="5" fill="#4f46e5"/>
    <text x="409" y="214" fill="#e2e8f0" font-size="18" font-weight="750">Bokmål-filtered</text>
    <text x="1260" y="214" text-anchor="end" fill="#5eead4" font-size="19" font-weight="800">Controlled variable: type of examples selected</text>

    <rect x="80" y="290" width="390" height="365" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="275" y="340" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="850">600M</text>
    <text x="275" y="375" text-anchor="middle" fill="#64748b" font-size="17">Bokmål-only output · original test</text>
    <rect x="145" y="430" width="260" height="58" rx="12" fill="#e2e8f0"/>
    <rect x="145" y="430" width="205" height="58" rx="12" fill="#94a3b8"/>
    <text x="360" y="467" fill="#475569" font-size="20" font-weight="850">79.1%</text>
    <rect x="145" y="520" width="260" height="58" rx="12" fill="#c7d2fe"/>
    <rect x="145" y="520" width="244" height="58" rx="12" fill="#4f46e5"/>
    <text x="350" y="557" text-anchor="end" fill="#ffffff" font-size="20" font-weight="850">93.7%</text>
    <text x="275" y="620" text-anchor="middle" fill="#3730a3" font-size="22" font-weight="850">+14.6 points</text>

    <rect x="525" y="290" width="390" height="365" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="720" y="340" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="850">1.3B</text>
    <text x="720" y="375" text-anchor="middle" fill="#64748b" font-size="17">Bokmål-only output · original test</text>
    <rect x="590" y="430" width="260" height="58" rx="12" fill="#e2e8f0"/>
    <rect x="590" y="430" width="207" height="58" rx="12" fill="#94a3b8"/>
    <text x="807" y="467" fill="#475569" font-size="20" font-weight="850">79.6%</text>
    <rect x="590" y="520" width="260" height="58" rx="12" fill="#c7d2fe"/>
    <rect x="590" y="520" width="245" height="58" rx="12" fill="#4f46e5"/>
    <text x="796" y="557" text-anchor="end" fill="#ffffff" font-size="20" font-weight="850">94.3%</text>
    <text x="720" y="620" text-anchor="middle" fill="#3730a3" font-size="22" font-weight="850">+14.7 points</text>

    <rect x="970" y="290" width="390" height="365" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1165" y="340" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="850">3.3B</text>
    <text x="1165" y="375" text-anchor="middle" fill="#64748b" font-size="17">Bokmål-only output · original test</text>
    <rect x="1035" y="430" width="260" height="58" rx="12" fill="#e2e8f0"/>
    <rect x="1035" y="430" width="207" height="58" rx="12" fill="#94a3b8"/>
    <text x="1252" y="467" fill="#475569" font-size="20" font-weight="850">79.8%</text>
    <rect x="1035" y="520" width="260" height="58" rx="12" fill="#c7d2fe"/>
    <rect x="1035" y="520" width="246" height="58" rx="12" fill="#4f46e5"/>
    <text x="1242" y="557" text-anchor="end" fill="#ffffff" font-size="20" font-weight="850">94.6%</text>
    <text x="1165" y="620" text-anchor="middle" fill="#3730a3" font-size="22" font-weight="850">+14.8 points</text>
  </g>
  <rect x="285" y="700" width="870" height="62" rx="31" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="720" y="739" text-anchor="middle" fill="#312e81" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800">The same selection effect appears at all three model sizes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">RQ2 size-controlled data-selection experiment</title>
  <desc id="desc">The original-subsampled and Bokmål-filtered conditions contain the same 10,114 training sentence pairs. Across 600M, 1.3B, and 3.3B models, the filtered condition produces about 15 percentage points more Bokmål-only output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1440" height="810" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="720" y="62" text-anchor="middle" fill="#0f172a" font-size="40" font-weight="760">RQ2 · Is the shift caused by using less training data?</text>
    <text x="720" y="101" text-anchor="middle" fill="#64748b" font-size="20">Size-controlled experiment: hold the amount constant, change the selected examples</text>

    <!-- Size-matched training conditions -->
    <rect x="70" y="145" width="525" height="220" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="94" y="169" width="190" height="32" rx="16" fill="#f1f5f9"/>
    <text x="189" y="191" text-anchor="middle" fill="#475569" font-size="15" font-weight="850" letter-spacing="1">CONTROL CONDITION</text>
    <text x="105" y="242" fill="#0f172a" font-size="29" font-weight="850">Original-subsampled</text>
    <text x="105" y="278" fill="#64748b" font-size="18">Random subset of the original mixed corpus</text>
    <g>
      <rect x="105" y="306" width="112" height="34" rx="17" fill="#eef2ff"/>
      <text x="161" y="329" text-anchor="middle" fill="#3730a3" font-size="16" font-weight="800">Bokmål</text>
      <rect x="228" y="306" width="116" height="34" rx="17" fill="#fff7ed"/>
      <text x="286" y="329" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="800">Nynorsk</text>
      <rect x="355" y="306" width="92" height="34" rx="17" fill="#f1f5f9"/>
      <text x="401" y="329" text-anchor="middle" fill="#475569" font-size="16" font-weight="800">Mixed</text>
    </g>

    <rect x="845" y="145" width="525" height="220" rx="26" fill="#eef2ff" stroke="#818cf8" stroke-width="2.5"/>
    <rect x="869" y="169" width="214" height="32" rx="16" fill="#c7d2fe"/>
    <text x="976" y="191" text-anchor="middle" fill="#3730a3" font-size="15" font-weight="850" letter-spacing="1">FILTERED CONDITION</text>
    <text x="880" y="242" fill="#312e81" font-size="29" font-weight="850">Bokmål-filtered</text>
    <text x="880" y="278" fill="#6366f1" font-size="18">Examples selected toward Bokmål with SLIDE</text>
    <rect x="880" y="306" width="204" height="34" rx="17" fill="#4f46e5"/>
    <text x="982" y="329" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="850">Mainly Bokmål</text>

    <!-- Equality bridge -->
    <path d="M595 255H845" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="625" y="183" width="190" height="143" rx="23" fill="#0f172a"/>
    <text x="720" y="217" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="850" letter-spacing="1.2">SAME DATA AMOUNT</text>
    <text x="720" y="265" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="900">10,114</text>
    <text x="720" y="292" text-anchor="middle" fill="#cbd5e1" font-size="16">training sentence pairs</text>
    <text x="720" y="350" text-anchor="middle" fill="#475569" font-size="15" font-weight="750">Only selection differs</text>

    <!-- Replication results -->
    <rect x="70" y="410" width="1300" height="310" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="105" y="451" fill="#0f172a" font-size="23" font-weight="850">Replication across NLLB-200 model sizes</text>
    <text x="1335" y="451" text-anchor="end" fill="#64748b" font-size="16">Original mixed-standard test · NB-only outputs · mean over three seeds</text>

    <g font-size="15" font-weight="800" fill="#64748b" letter-spacing="0.5">
      <text x="145" y="493">MODEL SIZE</text>
      <text x="392" y="493">ORIGINAL-SUBSAMPLED</text>
      <text x="800" y="493">BOKMÅL-FILTERED</text>
      <text x="1243" y="493" text-anchor="middle">DIFFERENCE</text>
    </g>

    <!-- 600M -->
    <rect x="100" y="512" width="1240" height="54" rx="14" fill="#f8fafc"/>
    <text x="145" y="546" fill="#0f172a" font-size="21" font-weight="850">600M</text>
    <rect x="390" y="523" width="280" height="32" rx="16" fill="#e2e8f0"/>
    <rect x="390" y="523" width="221" height="32" rx="16" fill="#94a3b8"/>
    <text x="530" y="545" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="850">79.1%</text>
    <rect x="800" y="523" width="280" height="32" rx="16" fill="#c7d2fe"/>
    <rect x="800" y="523" width="262" height="32" rx="16" fill="#4f46e5"/>
    <text x="940" y="545" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="850">93.7%</text>
    <rect x="1180" y="520" width="126" height="38" rx="19" fill="#ecfeff"/>
    <text x="1243" y="546" text-anchor="middle" fill="#0e7490" font-size="17" font-weight="900">+14.6 pp</text>

    <!-- 1.3B -->
    <rect x="100" y="578" width="1240" height="54" rx="14" fill="#f8fafc"/>
    <text x="145" y="612" fill="#0f172a" font-size="21" font-weight="850">1.3B</text>
    <rect x="390" y="589" width="280" height="32" rx="16" fill="#e2e8f0"/>
    <rect x="390" y="589" width="223" height="32" rx="16" fill="#94a3b8"/>
    <text x="530" y="611" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="850">79.6%</text>
    <rect x="800" y="589" width="280" height="32" rx="16" fill="#c7d2fe"/>
    <rect x="800" y="589" width="264" height="32" rx="16" fill="#4f46e5"/>
    <text x="940" y="611" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="850">94.3%</text>
    <rect x="1180" y="586" width="126" height="38" rx="19" fill="#ecfeff"/>
    <text x="1243" y="612" text-anchor="middle" fill="#0e7490" font-size="17" font-weight="900">+14.7 pp</text>

    <!-- 3.3B -->
    <rect x="100" y="644" width="1240" height="54" rx="14" fill="#f8fafc"/>
    <text x="145" y="678" fill="#0f172a" font-size="21" font-weight="850">3.3B</text>
    <rect x="390" y="655" width="280" height="32" rx="16" fill="#e2e8f0"/>
    <rect x="390" y="655" width="223" height="32" rx="16" fill="#94a3b8"/>
    <text x="530" y="677" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="850">79.8%</text>
    <rect x="800" y="655" width="280" height="32" rx="16" fill="#c7d2fe"/>
    <rect x="800" y="655" width="265" height="32" rx="16" fill="#4f46e5"/>
    <text x="940" y="677" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="850">94.6%</text>
    <rect x="1180" y="652" width="126" height="38" rx="19" fill="#ecfeff"/>
    <text x="1243" y="678" text-anchor="middle" fill="#0e7490" font-size="17" font-weight="900">+14.8 pp</text>

    <rect x="225" y="751" width="990" height="42" rx="21" fill="#eef2ff"/>
    <text x="720" y="779" text-anchor="middle" fill="#312e81" font-size="19" font-weight="850">Answer: the shift follows which examples are selected—not how many examples are used.</text>
  </g>
</svg>

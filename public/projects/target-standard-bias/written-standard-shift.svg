<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">RQ1 controlled output-comparison experiment</title>
  <desc id="desc">Two models trained on mixed and Bokmål-filtered data translate the same 1,313 test sentences. SLIDE classifies each output as Bokmål, Nynorsk, or mixed, revealing a strong shift toward Bokmål after filtering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1440" height="810" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="720" y="62" text-anchor="middle" fill="#0f172a" font-size="40" font-weight="760">RQ1 · Does filtering change the type of Norwegian produced?</text>
    <text x="720" y="101" text-anchor="middle" fill="#64748b" font-size="20">Controlled comparison: change the training data, keep the evaluation identical</text>

    <g font-size="15" font-weight="800" letter-spacing="1.3">
      <text x="210" y="151" text-anchor="middle" fill="#475569">1 · TRAIN TWO MODELS</text>
      <text x="610" y="151" text-anchor="middle" fill="#475569">2 · SAME TEST INPUT</text>
      <text x="918" y="151" text-anchor="middle" fill="#475569">3 · CLASSIFY OUTPUTS</text>
      <text x="1218" y="151" text-anchor="middle" fill="#475569">4 · COMPARE SHARES</text>
    </g>

    <rect x="55" y="180" width="310" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="92" cy="219" r="18" fill="#4f46e5"/>
    <text x="92" y="225" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="850">A</text>
    <text x="122" y="219" fill="#0f172a" font-size="22" font-weight="820">Mixed-data model</text>
    <text x="85" y="258" fill="#64748b" font-size="17">Bokmål + Nynorsk training data</text>
    <text x="85" y="282" fill="#64748b" font-size="15">same architecture and training setup</text>

    <rect x="55" y="322" width="310" height="118" rx="20" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <circle cx="92" cy="361" r="18" fill="#4f46e5"/>
    <text x="92" y="367" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="850">B</text>
    <text x="122" y="361" fill="#312e81" font-size="19" font-weight="820">Bokmål-filtered model</text>
    <text x="85" y="400" fill="#6366f1" font-size="17">mainly Bokmål training data</text>
    <text x="85" y="424" fill="#6366f1" font-size="15">same architecture and training setup</text>

    <path d="M365 239H415Q440 239 440 264V286Q440 310 466 310H492" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <path d="M365 381H415Q440 381 440 356V334Q440 310 466 310H492" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <rect x="492" y="220" width="236" height="180" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/>
    <rect x="520" y="244" width="180" height="34" rx="17" fill="#e0f2fe"/>
    <text x="610" y="267" text-anchor="middle" fill="#0369a1" font-size="16" font-weight="850">IDENTICAL FOR A + B</text>
    <text x="610" y="318" text-anchor="middle" fill="#0f172a" font-size="26" font-weight="850">1,313 sentences</text>
    <text x="610" y="350" text-anchor="middle" fill="#475569" font-size="18">mixed-standard test set</text>
    <text x="610" y="377" text-anchor="middle" fill="#64748b" font-size="15">same inputs · same decoding</text>

    <path d="M728 310H783" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="790" y="220" width="256" height="180" rx="24" fill="#0f172a"/>
    <text x="918" y="266" text-anchor="middle" fill="#a5b4fc" font-size="17" font-weight="800" letter-spacing="1.5">SLIDE</text>
    <text x="918" y="305" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="820">Written-standard</text>
    <text x="918" y="334" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="820">classification</text>
    <g font-size="15" font-weight="750">
      <rect x="820" y="357" width="70" height="27" rx="13" fill="#4f46e5"/><text x="855" y="376" text-anchor="middle" fill="#ffffff">Bokmål</text>
      <rect x="898" y="357" width="72" height="27" rx="13" fill="#f97316"/><text x="934" y="376" text-anchor="middle" fill="#ffffff">Nynorsk</text>
      <rect x="978" y="357" width="42" height="27" rx="13" fill="#475569"/><text x="999" y="376" text-anchor="middle" fill="#ffffff">Mix</text>
    </g>

    <path d="M1046 310H1092" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1100" y="220" width="280" height="180" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1240" y="267" text-anchor="middle" fill="#0f172a" font-size="23" font-weight="820">Primary outcome</text>
    <text x="1240" y="310" text-anchor="middle" fill="#475569" font-size="18">Share of model outputs</text>
    <rect x="1140" y="338" width="200" height="38" rx="19" fill="#f1f5f9"/>
    <text x="1240" y="363" text-anchor="middle" fill="#334155" font-size="17" font-weight="750">Bokmål vs Nynorsk</text>

    <rect x="55" y="490" width="1325" height="245" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="91" y="530" fill="#0f172a" font-size="22" font-weight="850">Observed output distribution on the same test set</text>

    <text x="91" y="579" fill="#334155" font-size="18" font-weight="800">Model A · Mixed data</text>
    <rect x="295" y="554" width="850" height="36" rx="18" fill="#e2e8f0"/>
    <rect x="295" y="554" width="672" height="36" rx="18" fill="#4f46e5"/>
    <rect x="967" y="554" width="121" height="36" fill="#f97316"/>
    <text x="631" y="579" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="850">79.0% Bokmål</text>
    <text x="1027" y="579" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="850">14.2%</text>
    <text x="1170" y="579" fill="#9a3412" font-size="17" font-weight="800">Nynorsk</text>

    <text x="91" y="639" fill="#312e81" font-size="18" font-weight="800">Model B · Filtered</text>
    <rect x="295" y="614" width="850" height="36" rx="18" fill="#e2e8f0"/>
    <rect x="295" y="614" width="794" height="36" rx="18" fill="#4f46e5"/>
    <rect x="1089" y="614" width="6" height="36" fill="#f97316"/>
    <text x="692" y="639" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="850">93.4% Bokmål</text>
    <text x="1170" y="639" fill="#9a3412" font-size="17" font-weight="800">0.7% Nynorsk</text>

    <rect x="91" y="678" width="1253" height="37" rx="18" fill="#ecfeff"/>
    <text x="717" y="703" text-anchor="middle" fill="#155e75" font-size="18" font-weight="850">Answer: filtering shifts the model strongly toward Bokmål and almost eliminates Nynorsk output.</text>
    <text x="720" y="777" text-anchor="middle" fill="#64748b" font-size="16">Translation accuracy is checked separately through human evaluation; the primary RQ1 measure is written-standard output.</text>
  </g>
</svg>

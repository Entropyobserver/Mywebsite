<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">RQ1 written-standard output shift</title>
  <desc id="desc">On the same 1,313 mixed-standard test sentences, Bokmål-only output rises from 79.0 to 93.4 percent while Nynorsk-only output falls from 14.2 to 0.7 percent after Bokmål filtering.</desc>
  <rect width="1440" height="810" fill="#f8fafc"/>
  <text x="720" y="66" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="760">RQ1 · Filtering changes the Norwegian the model produces</text>
  <text x="720" y="108" text-anchor="middle" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="21">Same 1,313 mixed-standard test sentences · written standard identified with SLIDE</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="95" y="170" width="560" height="455" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="375" y="222" text-anchor="middle" fill="#0f172a" font-size="27" font-weight="800">Same-size mixed-data model</text>
    <text x="375" y="258" text-anchor="middle" fill="#64748b" font-size="18">trained on mixed Bokmål–Nynorsk examples</text>
    <rect x="170" y="320" width="410" height="92" rx="14" fill="#e2e8f0"/>
    <rect x="170" y="320" width="324" height="92" rx="14" fill="#4f46e5"/>
    <text x="332" y="376" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="850">79.0% Bokmål</text>
    <rect x="170" y="455" width="410" height="72" rx="14" fill="#e2e8f0"/>
    <rect x="170" y="455" width="58" height="72" rx="14" fill="#f97316"/>
    <text x="248" y="501" fill="#9a3412" font-size="25" font-weight="850">14.2% Nynorsk</text>
    <text x="375" y="579" text-anchor="middle" fill="#64748b" font-size="17">Remaining outputs: mixed or uncertain</text>

    <rect x="785" y="170" width="560" height="455" rx="26" fill="#eef2ff" stroke="#818cf8" stroke-width="3"/>
    <text x="1065" y="222" text-anchor="middle" fill="#312e81" font-size="27" font-weight="800">Bokmål-filtered model</text>
    <text x="1065" y="258" text-anchor="middle" fill="#6366f1" font-size="18">trained mainly on Bokmål examples</text>
    <rect x="860" y="320" width="410" height="92" rx="14" fill="#c7d2fe"/>
    <rect x="860" y="320" width="383" height="92" rx="14" fill="#4f46e5"/>
    <text x="1051" y="376" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="850">93.4% Bokmål</text>
    <rect x="860" y="455" width="410" height="72" rx="14" fill="#e2e8f0"/>
    <rect x="860" y="455" width="5" height="72" rx="3" fill="#f97316"/>
    <text x="885" y="501" fill="#9a3412" font-size="25" font-weight="850">0.7% Nynorsk</text>
    <text x="1065" y="579" text-anchor="middle" fill="#6366f1" font-size="17">Remaining outputs: mixed or uncertain</text>

    <path d="M650 387h125" stroke="#0f172a" stroke-width="5"/>
    <path d="M775 387l-18-12v24z" fill="#0f172a"/>
    <rect x="260" y="675" width="920" height="68" rx="20" fill="#0f172a"/>
    <text x="720" y="704" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">Human check: much stronger Bokmål conformity</text>
    <text x="720" y="731" text-anchor="middle" fill="#cbd5e1" font-size="18">No clear improvement in translation accuracy</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation matrix</title>
  <desc id="desc">A matrix separating translation quality, terminology, written-standard behavior, robustness, and human validation.</desc>
  <rect width="1440" height="810" fill="#f8fafc"/>
  <text x="90" y="80" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="780">One model comparison, five evaluation lenses</text>
  <text x="90" y="120" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="21">No single metric can identify both translation quality and target-standard specialization.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(90 175)">
      <rect width="1260" height="96" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
      <circle cx="58" cy="48" r="30" fill="#4f46e5"/><text x="58" y="57" text-anchor="middle" fill="white" font-size="24" font-weight="800">Q</text>
      <text x="110" y="42" fill="#1e1b4b" font-size="24" font-weight="800">Reference-based quality</text><text x="110" y="70" fill="#6366f1" font-size="18">BLEU · chrF</text>
      <text x="775" y="57" fill="#334155" font-size="21">How closely does output match the reference?</text>
    </g>
    <g transform="translate(90 287)">
      <rect width="1260" height="96" rx="18" fill="#ecfeff" stroke="#a5f3fc"/>
      <circle cx="58" cy="48" r="30" fill="#0891b2"/><text x="58" y="57" text-anchor="middle" fill="white" font-size="24" font-weight="800">T</text>
      <text x="110" y="42" fill="#164e63" font-size="24" font-weight="800">Domain terminology</text><text x="110" y="70" fill="#0891b2" font-size="18">Terminology F1</text>
      <text x="775" y="57" fill="#334155" font-size="21">Are petroleum terms transferred correctly?</text>
    </g>
    <g transform="translate(90 399)">
      <rect width="1260" height="96" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
      <circle cx="58" cy="48" r="30" fill="#16a34a"/><text x="58" y="57" text-anchor="middle" fill="white" font-size="24" font-weight="800">S</text>
      <text x="110" y="42" fill="#14532d" font-size="24" font-weight="800">Written-standard behavior</text><text x="110" y="70" fill="#16a34a" font-size="18">High-Bokmål · Nynorsk-like rates</text>
      <text x="775" y="57" fill="#334155" font-size="21">Which valid Norwegian forms does the model prefer?</text>
    </g>
    <g transform="translate(90 511)">
      <rect width="1260" height="96" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
      <circle cx="58" cy="48" r="30" fill="#ea580c"/><text x="58" y="57" text-anchor="middle" fill="white" font-size="24" font-weight="800">R</text>
      <text x="110" y="42" fill="#7c2d12" font-size="24" font-weight="800">Robustness</text><text x="110" y="70" fill="#ea580c" font-size="18">Model scales · FLORES</text>
      <text x="775" y="57" fill="#334155" font-size="21">Does the pattern persist beyond one setup?</text>
    </g>
    <g transform="translate(90 623)">
      <rect width="1260" height="96" rx="18" fill="#fdf4ff" stroke="#f5d0fe"/>
      <circle cx="58" cy="48" r="30" fill="#a21caf"/><text x="58" y="57" text-anchor="middle" fill="white" font-size="24" font-weight="800">H</text>
      <text x="110" y="42" fill="#701a75" font-size="24" font-weight="800">Human validation</text><text x="110" y="70" fill="#a21caf" font-size="18">Standard label · meaning · terminology</text>
      <text x="775" y="57" fill="#334155" font-size="21">Do automated labels support the interpretation?</text>
    </g>
  </g>
  <text x="720" y="775" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Report the lenses together; interpret disagreements rather than averaging them away.</text>
</svg>

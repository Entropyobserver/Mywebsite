<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">RQ3 evaluation-set comparison</title>
  <desc id="desc">The same two size-controlled models are evaluated on a Bokmål test set and an original mixed-standard test set. The higher-scoring model changes with the evaluation set.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1440" height="810" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="720" y="61" text-anchor="middle" fill="#0f172a" font-size="42" font-weight="780">RQ3 · Does the test set change the winner?</text>
    <text x="720" y="101" text-anchor="middle" fill="#64748b" font-size="20">Same two size-controlled models, evaluated on two different test sets</text>

    <!-- Models held fixed -->
    <rect x="350" y="132" width="740" height="78" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="390" y="164" fill="#475569" font-size="14" font-weight="850" letter-spacing="1.2">SAME MODELS</text>
    <rect x="520" y="147" width="230" height="46" rx="23" fill="#e2e8f0"/>
    <circle cx="548" cy="170" r="10" fill="#94a3b8"/>
    <text x="570" y="176" fill="#334155" font-size="17" font-weight="820">Original-subsampled</text>
    <text x="777" y="176" text-anchor="middle" fill="#94a3b8" font-size="20" font-weight="800">vs</text>
    <rect x="810" y="147" width="230" height="46" rx="23" fill="#eef2ff"/>
    <circle cx="838" cy="170" r="10" fill="#4f46e5"/>
    <text x="860" y="176" fill="#3730a3" font-size="17" font-weight="820">Bokmål-filtered</text>

    <!-- Split to the test sets -->
    <path d="M720 210V229Q720 244 700 244H385Q365 244 365 264V284" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M720 210V229Q720 244 740 244H1055Q1075 244 1075 264V284" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Bokmål test -->
    <rect x="70" y="292" width="610" height="390" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="70" y="292" width="610" height="9" rx="5" fill="#0ea5e9"/>
    <text x="375" y="349" text-anchor="middle" fill="#0f172a" font-size="29" font-weight="860">Bokmål test set</text>
    <text x="375" y="383" text-anchor="middle" fill="#64748b" font-size="18">1,313 sentences · predominantly Bokmål references</text>

    <rect x="115" y="424" width="520" height="64" rx="17" fill="#f1f5f9"/>
    <circle cx="146" cy="456" r="10" fill="#94a3b8"/>
    <text x="170" y="463" fill="#334155" font-size="18" font-weight="780">Original-subsampled</text>
    <text x="595" y="465" text-anchor="end" fill="#334155" font-size="29" font-weight="900">59.37</text>

    <rect x="115" y="504" width="520" height="72" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <circle cx="146" cy="540" r="10" fill="#4f46e5"/>
    <text x="170" y="547" fill="#3730a3" font-size="18" font-weight="800">Bokmål-filtered</text>
    <text x="595" y="549" text-anchor="end" fill="#312e81" font-size="31" font-weight="920">61.28</text>

    <rect x="215" y="606" width="320" height="48" rx="24" fill="#4f46e5"/>
    <text x="375" y="638" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="880">BOKMÅL-FILTERED WINS</text>

    <!-- Original mixed test -->
    <rect x="760" y="292" width="610" height="390" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="760" y="292" width="610" height="9" rx="5" fill="#0ea5e9"/>
    <text x="1065" y="349" text-anchor="middle" fill="#0f172a" font-size="29" font-weight="860">Original mixed-standard test</text>
    <text x="1065" y="383" text-anchor="middle" fill="#64748b" font-size="18">1,742 sentences · Bokmål and Nynorsk references</text>

    <rect x="805" y="420" width="520" height="72" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="836" cy="456" r="10" fill="#94a3b8"/>
    <text x="860" y="463" fill="#334155" font-size="18" font-weight="800">Original-subsampled</text>
    <text x="1285" y="465" text-anchor="end" fill="#0f172a" font-size="31" font-weight="920">61.77</text>

    <rect x="805" y="508" width="520" height="64" rx="17" fill="#eef2ff"/>
    <circle cx="836" cy="540" r="10" fill="#4f46e5"/>
    <text x="860" y="547" fill="#3730a3" font-size="18" font-weight="780">Bokmål-filtered</text>
    <text x="1285" y="549" text-anchor="end" fill="#312e81" font-size="29" font-weight="900">58.49</text>

    <rect x="890" y="606" width="350" height="48" rx="24" fill="#64748b"/>
    <text x="1065" y="638" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="880">ORIGINAL-SUBSAMPLED WINS</text>

    <!-- Takeaway -->
    <rect x="250" y="714" width="940" height="48" rx="24" fill="#ecfeff"/>
    <text x="720" y="746" text-anchor="middle" fill="#155e75" font-size="21" font-weight="880">Different test sets favour different models.</text>
    <text x="720" y="794" text-anchor="middle" fill="#64748b" font-size="15">Different test sets—not a reference-only swap.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">All sixteen training-data combinations</title>
  <desc id="desc">The complete two-to-the-four coalition space, organized by coalition size from the empty coalition to all four groups.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="0.52" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#fff2fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#334155" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 23px Inter, Arial, sans-serif; fill: #52637a; }
      .row-title { font: 700 24px Inter, Arial, sans-serif; fill: #172033; }
      .row-count { font: 600 18px Inter, Arial, sans-serif; fill: #64748b; }
      .chip { font: 700 19px Inter, Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .empty { font: 700 22px Inter, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .legend { font: 600 18px Inter, Arial, sans-serif; fill: #334155; }
      .equation { font: 700 28px Inter, Arial, sans-serif; fill: #1d4ed8; text-anchor: middle; }
      .note { font: 400 18px Inter, Arial, sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <rect x="8" y="8" width="1584" height="1024" rx="32" fill="url(#bg)" stroke="#d9e4f2" stroke-width="2"/>
  <text x="80" y="88" class="title">All 16 Training-Data Combinations</text>
  <text x="80" y="132" class="subtitle">Each box represents one training condition.</text>

  <!-- Legend -->
  <g transform="translate(80 170)">
    <rect x="0" y="0" width="250" height="52" rx="26" fill="#dbeafe" stroke="#60a5fa"/>
    <circle cx="28" cy="26" r="10" fill="#3b82f6"/>
    <text x="50" y="33" class="legend">H · High-Bokmål</text>
    <rect x="270" y="0" width="190" height="52" rx="26" fill="#fef3c7" stroke="#f59e0b"/>
    <circle cx="298" cy="26" r="10" fill="#f59e0b"/>
    <text x="320" y="33" class="legend">B · Boundary</text>
    <rect x="480" y="0" width="250" height="52" rx="26" fill="#dcfce7" stroke="#22c55e"/>
    <circle cx="508" cy="26" r="10" fill="#22c55e"/>
    <text x="530" y="33" class="legend">N · Nynorsk-like</text>
    <rect x="750" y="0" width="275" height="52" rx="26" fill="#f3e8ff" stroke="#a855f7"/>
    <circle cx="778" cy="26" r="10" fill="#a855f7"/>
    <text x="800" y="33" class="legend">O · Uncertain-other</text>
  </g>

  <!-- Empty -->
  <text x="80" y="298" class="row-title">0 groups</text>
  <text x="80" y="326" class="row-count">1 coalition</text>
  <g filter="url(#shadow)">
    <rect x="330" y="266" width="190" height="76" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="425" y="299" class="empty">∅</text>
    <text x="425" y="326" class="note">base model</text>
  </g>

  <!-- Singletons -->
  <text x="80" y="416" class="row-title">1 group</text>
  <text x="80" y="444" class="row-count">4 coalitions</text>
  <g transform="translate(330 382)" filter="url(#shadow)">
    <g><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="55" y="17" width="80" height="42" rx="21" fill="#dbeafe" stroke="#60a5fa"/><text x="95" y="38" class="chip">H</text></g>
    <g transform="translate(220)"><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="55" y="17" width="80" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/><text x="95" y="38" class="chip">B</text></g>
    <g transform="translate(440)"><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="55" y="17" width="80" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/><text x="95" y="38" class="chip">N</text></g>
    <g transform="translate(660)"><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="55" y="17" width="80" height="42" rx="21" fill="#f3e8ff" stroke="#a855f7"/><text x="95" y="38" class="chip">O</text></g>
  </g>

  <!-- Pairs -->
  <text x="80" y="546" class="row-title">2 groups</text>
  <text x="80" y="574" class="row-count">6 coalitions</text>
  <g transform="translate(330 508)" filter="url(#shadow)">
    <g><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="37" y="17" width="52" height="42" rx="21" fill="#dbeafe" stroke="#60a5fa"/><text x="63" y="38" class="chip">H</text><rect x="101" y="17" width="52" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/><text x="127" y="38" class="chip">B</text></g>
    <g transform="translate(210)"><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="37" y="17" width="52" height="42" rx="21" fill="#dbeafe" stroke="#60a5fa"/><text x="63" y="38" class="chip">H</text><rect x="101" y="17" width="52" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/><text x="127" y="38" class="chip">N</text></g>
    <g transform="translate(420)"><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="37" y="17" width="52" height="42" rx="21" fill="#dbeafe" stroke="#60a5fa"/><text x="63" y="38" class="chip">H</text><rect x="101" y="17" width="52" height="42" rx="21" fill="#f3e8ff" stroke="#a855f7"/><text x="127" y="38" class="chip">O</text></g>
    <g transform="translate(630)"><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="37" y="17" width="52" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/><text x="63" y="38" class="chip">B</text><rect x="101" y="17" width="52" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/><text x="127" y="38" class="chip">N</text></g>
    <g transform="translate(840)"><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="37" y="17" width="52" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/><text x="63" y="38" class="chip">B</text><rect x="101" y="17" width="52" height="42" rx="21" fill="#f3e8ff" stroke="#a855f7"/><text x="127" y="38" class="chip">O</text></g>
    <g transform="translate(1050)"><rect width="190" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="37" y="17" width="52" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/><text x="63" y="38" class="chip">N</text><rect x="101" y="17" width="52" height="42" rx="21" fill="#f3e8ff" stroke="#a855f7"/><text x="127" y="38" class="chip">O</text></g>
  </g>

  <!-- Triples -->
  <text x="80" y="676" class="row-title">3 groups</text>
  <text x="80" y="704" class="row-count">4 coalitions</text>
  <g transform="translate(330 638)" filter="url(#shadow)">
    <g><rect width="250" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="35" y="17" width="52" height="42" rx="21" fill="#dbeafe" stroke="#60a5fa"/><text x="61" y="38" class="chip">H</text><rect x="99" y="17" width="52" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/><text x="125" y="38" class="chip">B</text><rect x="163" y="17" width="52" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/><text x="189" y="38" class="chip">N</text></g>
    <g transform="translate(280)"><rect width="250" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="35" y="17" width="52" height="42" rx="21" fill="#dbeafe" stroke="#60a5fa"/><text x="61" y="38" class="chip">H</text><rect x="99" y="17" width="52" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/><text x="125" y="38" class="chip">B</text><rect x="163" y="17" width="52" height="42" rx="21" fill="#f3e8ff" stroke="#a855f7"/><text x="189" y="38" class="chip">O</text></g>
    <g transform="translate(560)"><rect width="250" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="35" y="17" width="52" height="42" rx="21" fill="#dbeafe" stroke="#60a5fa"/><text x="61" y="38" class="chip">H</text><rect x="99" y="17" width="52" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/><text x="125" y="38" class="chip">N</text><rect x="163" y="17" width="52" height="42" rx="21" fill="#f3e8ff" stroke="#a855f7"/><text x="189" y="38" class="chip">O</text></g>
    <g transform="translate(840)"><rect width="250" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="35" y="17" width="52" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/><text x="61" y="38" class="chip">B</text><rect x="99" y="17" width="52" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/><text x="125" y="38" class="chip">N</text><rect x="163" y="17" width="52" height="42" rx="21" fill="#f3e8ff" stroke="#a855f7"/><text x="189" y="38" class="chip">O</text></g>
  </g>

  <!-- All -->
  <text x="80" y="806" class="row-title">4 groups</text>
  <text x="80" y="834" class="row-count">1 coalition</text>
  <g transform="translate(330 768)" filter="url(#shadow)">
    <rect width="310" height="76" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <rect x="31" y="17" width="52" height="42" rx="21" fill="#dbeafe" stroke="#60a5fa"/><text x="57" y="38" class="chip">H</text>
    <rect x="95" y="17" width="52" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/><text x="121" y="38" class="chip">B</text>
    <rect x="159" y="17" width="52" height="42" rx="21" fill="#dcfce7" stroke="#22c55e"/><text x="185" y="38" class="chip">N</text>
    <rect x="223" y="17" width="52" height="42" rx="21" fill="#f3e8ff" stroke="#a855f7"/><text x="249" y="38" class="chip">O</text>
  </g>

  <line x1="80" y1="900" x2="1520" y2="900" stroke="#cbd5e1"/>
  <text x="800" y="950" class="equation">1 + 4 + 6 + 4 + 1 = 16 coalitions</text>
  <text x="800" y="988" class="note">The empty coalition uses the original base model; every non-empty coalition is fine-tuned separately.</text>
</svg>

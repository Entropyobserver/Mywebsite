<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Final untouched 28-day model comparison</title><desc id="desc">Google TimesFM ranks first at 5.75 percent WAPE, almost tied with Gradient Boosting at 5.77 percent.</desc><rect width="1200" height="650" rx="28" fill="#071d1a"/><g font-family="Arial"><text x="70" y="72" fill="#f0fdf4" font-size="32" font-weight="700">Which model generalizes best to the unseen final month?</text><rect x="70" y="125" width="500" height="365" rx="24" fill="#0d332a"/><text x="110" y="175" fill="#8fbba8" font-size="17">FINAL 28-DAY WAPE</text><text x="110" y="235" fill="#fff" font-size="24">Google TimesFM 3.0</text><text x="510" y="235" text-anchor="end" fill="#22d3ee" font-size="32" font-weight="700">5.75%</text><text x="110" y="305" fill="#fff" font-size="24">Gradient Boosting</text><text x="510" y="305" text-anchor="end" fill="#6ee7b7" font-size="32" font-weight="700">5.77%</text><text x="110" y="375" fill="#fff" font-size="24">Meta Prophet</text><text x="510" y="375" text-anchor="end" fill="#fbbf24" font-size="32" font-weight="700">6.77%</text><line x1="110" y1="410" x2="530" y2="410" stroke="#28624f"/><text x="110" y="451" fill="#a7d7c1" font-size="18">TimesFM vs Gradient Boosting:</text><text x="485" y="451" text-anchor="end" fill="#fff" font-size="20" font-weight="700">0.02 pp</text><rect x="610" y="125" width="520" height="365" rx="24" fill="#0d332a"/><text x="650" y="175" fill="#8fbba8" font-size="17">WHAT THE RANKING SHIFT MEANS</text><text x="650" y="230" fill="#fff" font-size="23" font-weight="700">Historical stability</text><text x="650" y="263" fill="#a7d7c1" font-size="18">Prophet wins the repeated backtest.</text><text x="650" y="325" fill="#fff" font-size="23" font-weight="700">Latest-month generalization</text><text x="650" y="358" fill="#a7d7c1" font-size="18">TimesFM wins the untouched holdout.</text><text x="650" y="420" fill="#fff" font-size="23" font-weight="700">Decision discipline</text><text x="650" y="453" fill="#a7d7c1" font-size="18">Do not retune after viewing the test set.</text><rect x="70" y="540" width="1060" height="62" rx="15" fill="#152e28"/><text x="98" y="578" fill="#d1fae5" font-size="19">The result supports continuous champion–challenger monitoring, not a claim that one model always wins.</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Mean WAPE across four rolling validation windows</title><desc id="desc">Meta Prophet ranks first at 5.89 percent, followed by Google TimesFM at 5.98 percent.</desc><rect width="1200" height="650" rx="28" fill="#071d1a"/><g font-family="Arial"><text x="70" y="70" fill="#f0fdf4" font-size="32" font-weight="700">Which model is most stable across historical windows?</text><text x="70" y="108" fill="#8fbba8" font-size="18">Mean WAPE across four 28-day rolling validations · lower is better</text><g fill="#d1fae5" font-size="18"><text x="70" y="174">Meta Prophet</text><text x="70" y="234">Google TimesFM 3.0</text><text x="70" y="294">Gradient Boosting</text><text x="70" y="354">Exponential Smoothing</text><text x="70" y="414">SARIMA</text><text x="70" y="474">Four-Week Mean</text><text x="70" y="534">Seasonal Naive</text></g><g><rect x="300" y="145" width="328" height="34" rx="9" fill="#34d399"/><rect x="300" y="205" width="333" height="34" rx="9" fill="#22d3ee"/><rect x="300" y="265" width="365" height="34" rx="9" fill="#5eead4"/><rect x="300" y="325" width="411" height="34" rx="9" fill="#4f8f79"/><rect x="300" y="385" width="443" height="34" rx="9" fill="#4f8f79"/><rect x="300" y="445" width="496" height="34" rx="9" fill="#3f6f60"/><rect x="300" y="505" width="600" height="34" rx="9" fill="#3f6f60"/></g><g fill="#f0fdf4" font-size="18" font-weight="700"><text x="646" y="169">5.89%</text><text x="651" y="229">5.98%</text><text x="683" y="289">6.56%</text><text x="729" y="349">7.39%</text><text x="761" y="409">7.96%</text><text x="814" y="469">8.92%</text><text x="918" y="529">10.78%</text></g><rect x="70" y="579" width="1060" height="43" rx="12" fill="#0d332a"/><text x="92" y="607" fill="#a7f3d0" font-size="17">Selection rule: choose the lowest mean rolling-validation WAPE before opening the final test month.</text></g>
</svg>

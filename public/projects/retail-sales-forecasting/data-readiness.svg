<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Retail forecasting data readiness</title><desc id="desc">The store scope contains 3049 items, three categories, and 1941 continuous daily observations.</desc><rect width="1200" height="650" rx="28" fill="#071d1a"/><g font-family="Arial"><text x="70" y="72" fill="#f0fdf4" font-size="32" font-weight="700">Is the data suitable for demand forecasting?</text>
  <rect x="70" y="120" width="250" height="170" rx="20" fill="#0d332a"/><text x="100" y="166" fill="#6ee7b7" font-size="17">ITEMS IN CA_1</text><text x="100" y="228" fill="#fff" font-size="48" font-weight="700">3,049</text><text x="100" y="260" fill="#8fbba8" font-size="16">across three categories</text><rect x="345" y="120" width="250" height="170" rx="20" fill="#0d332a"/><text x="375" y="166" fill="#6ee7b7" font-size="17">HISTORICAL DAYS</text><text x="375" y="228" fill="#fff" font-size="48" font-weight="700">1,941</text><text x="375" y="260" fill="#8fbba8" font-size="16">continuous daily history</text><rect x="620" y="120" width="250" height="170" rx="20" fill="#0d332a"/><text x="650" y="166" fill="#6ee7b7" font-size="17">MISSING SALES DAYS</text><text x="650" y="228" fill="#4ade80" font-size="48" font-weight="700">0</text><text x="650" y="260" fill="#8fbba8" font-size="16">no negative sales</text><rect x="895" y="120" width="235" height="170" rx="20" fill="#0d332a"/><text x="925" y="166" fill="#6ee7b7" font-size="17">FORECAST HORIZON</text><text x="925" y="228" fill="#fff" font-size="48" font-weight="700">28</text><text x="925" y="260" fill="#8fbba8" font-size="16">future calendar days</text>
  <text x="70" y="365" fill="#d1fae5" font-size="22" font-weight="700">Available signals</text><g fill="#153f35" stroke="#28624f"><rect x="70" y="395" width="180" height="54" rx="14"/><rect x="270" y="395" width="180" height="54" rx="14"/><rect x="470" y="395" width="180" height="54" rx="14"/><rect x="670" y="395" width="180" height="54" rx="14"/><rect x="870" y="395" width="260" height="54" rx="14"/></g><g fill="#d1fae5" font-size="17" text-anchor="middle"><text x="160" y="428">Daily units</text><text x="360" y="428">Weekly price</text><text x="560" y="428">Events</text><text x="760" y="428">SNAP days</text><text x="1000" y="428">Store / category hierarchy</text></g><rect x="70" y="520" width="1060" height="70" rx="16" fill="#2c2412"/><text x="98" y="553" fill="#fde68a" font-size="18" font-weight="700">Interpretation boundary</text><text x="98" y="578" fill="#e5d4a0" font-size="17">Observed sales are not unconstrained demand; inventory and lost-sales fields are unavailable.</text></g>
</svg>

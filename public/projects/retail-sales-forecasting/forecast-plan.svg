<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">CA_1 next 28-day forecast plan</title><desc id="desc">Prophet forecasts 132211 units, averaging 4722 per day, with empirical bounds from 128002 to 142035.</desc><rect width="1200" height="650" rx="28" fill="#071d1a"/><g font-family="Arial"><text x="70" y="72" fill="#f0fdf4" font-size="32" font-weight="700">What volume should the store plan for?</text><text x="70" y="108" fill="#8fbba8" font-size="18">Future forecast follows the pre-defined rolling-validation winner: Meta Prophet</text><rect x="70" y="145" width="500" height="330" rx="24" fill="#0d332a"/><text x="110" y="195" fill="#6ee7b7" font-size="18">NEXT 28 DAYS</text><text x="110" y="275" fill="#fff" font-size="58" font-weight="700">132,211</text><text x="110" y="312" fill="#a7d7c1" font-size="20">forecast units</text><line x1="110" y1="350" x2="530" y2="350" stroke="#28624f"/><text x="110" y="395" fill="#fff" font-size="22">Daily average</text><text x="510" y="395" text-anchor="end" fill="#6ee7b7" font-size="28" font-weight="700">4,722</text><text x="110" y="445" fill="#fff" font-size="22">Peak day</text><text x="510" y="445" text-anchor="end" fill="#fbbf24" font-size="22" font-weight="700">Jun 5 · 6,113</text><rect x="610" y="145" width="520" height="330" rx="24" fill="#0d332a"/><text x="650" y="195" fill="#6ee7b7" font-size="18">EMPIRICAL PLANNING RANGE</text><text x="650" y="260" fill="#fff" font-size="38" font-weight="700">128,002 – 142,035</text><text x="650" y="298" fill="#a7d7c1" font-size="19">sum of horizon-specific 80% bounds</text><rect x="650" y="345" width="430" height="28" rx="14" fill="#285847"/><rect x="650" y="345" width="265" height="28" rx="14" fill="#34d399"/><circle cx="915" cy="359" r="12" fill="#fff"/><text x="650" y="415" fill="#d1fae5" font-size="18">Forecast is a planning input—not an order quantity.</text><text x="650" y="447" fill="#8fbba8" font-size="16">Add inventory, inbound supply, lead time, and service level.</text><rect x="70" y="530" width="1060" height="72" rx="16" fill="#2c2412"/><text x="98" y="563" fill="#fde68a" font-size="18" font-weight="700">Known limitation</text><text x="98" y="588" fill="#e5d4a0" font-size="17">Without stock-on-hand and stockout records, the forecast cannot estimate lost demand or final replenishment quantity.</text></g>
</svg>

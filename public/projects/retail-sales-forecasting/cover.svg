<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Retail sales forecasting and model comparison</title>
  <desc id="desc">A green forecasting dashboard with a rising time-series line, uncertainty band, and MAE comparison between Prophet and SARIMA.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06251f"/><stop offset="1" stop-color="#174b3a"/></linearGradient><linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6ee7b7" stop-opacity=".34"/><stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/></linearGradient></defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="85" r="170" fill="#34d399" opacity=".09"/>
  <text x="72" y="86" fill="#6ee7b7" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">TIME SERIES</text>
  <text x="72" y="145" fill="#f0fdf4" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="750">Retail Sales Forecasting</text>
  <text x="72" y="184" fill="#a7d7c1" font-family="Inter,Arial,sans-serif" font-size="22">Prophet vs SARIMA · chronological holdout</text>
  <rect x="72" y="226" width="700" height="360" rx="24" fill="#0a3329" stroke="#2c6b55"/>
  <text x="112" y="273" fill="#d1fae5" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">12-MONTH OUTLOOK</text>
  <g stroke="#285847" stroke-width="1"><line x1="112" y1="329" x2="730" y2="329"/><line x1="112" y1="408" x2="730" y2="408"/><line x1="112" y1="487" x2="730" y2="487"/></g>
  <path d="M112 497 C165 475 194 488 245 438 S326 462 375 402 S456 430 503 363 S585 401 631 321 S692 355 730 287 L730 489 C683 502 651 454 605 487 S531 452 486 500 S403 475 354 520 S272 488 220 529 S145 515 112 545Z" fill="url(#band)"/>
  <path d="M112 519 C165 493 195 507 245 465 S326 486 375 431 S456 458 503 398 S585 429 631 356 S692 389 730 324" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round"/>
  <line x1="512" y1="302" x2="512" y2="540" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 8"/><text x="524" y="320" fill="#fcd34d" font-family="Inter,Arial,sans-serif" font-size="15">FORECAST</text>
  <rect x="808" y="226" width="320" height="360" rx="24" fill="#0a3329" stroke="#2c6b55"/>
  <text x="848" y="273" fill="#d1fae5" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">HOLDOUT MAE</text>
  <text x="848" y="337" fill="#a7d7c1" font-family="Inter,Arial,sans-serif" font-size="18">Prophet</text>
  <rect x="848" y="355" width="224" height="26" rx="8" fill="#245846"/><rect x="848" y="355" width="207" height="26" rx="8" fill="#a7f3d0"/>
  <text x="848" y="414" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="750">3,592.32</text>
  <text x="848" y="468" fill="#a7d7c1" font-family="Inter,Arial,sans-serif" font-size="18">SARIMA</text>
  <rect x="848" y="486" width="224" height="26" rx="8" fill="#245846"/><rect x="848" y="486" width="170" height="26" rx="8" fill="#34d399"/>
  <text x="848" y="548" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="750">2,953.75</text>

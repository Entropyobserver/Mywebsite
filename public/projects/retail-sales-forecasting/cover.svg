  <rect width="1200" height="675" rx="32" fill="url(#bg)"/><circle cx="1090" cy="65" r="190" fill="#34d399" opacity=".08"/>
  <g font-family="Inter,Arial,sans-serif"><text x="70" y="78" fill="#6ee7b7" font-size="19" font-weight="700" letter-spacing="3">RETAIL DEMAND FORECASTING</text><text x="70" y="137" fill="#f0fdf4" font-size="42" font-weight="750">Which Model Generalizes Best?</text><text x="70" y="180" fill="#a7d7c1" font-size="21">Classical models · Gradient Boosting · Meta Prophet · Google TimesFM 3.0</text>

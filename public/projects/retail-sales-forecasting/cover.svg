<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Retail demand forecasting with classical, machine-learning, and foundation models</title><desc id="desc">A green forecasting dashboard comparing Meta Prophet, Google TimesFM, and Gradient Boosting on Walmart M5 sales.</desc>

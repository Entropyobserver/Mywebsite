<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Replay-based continual adaptation</title>
  <desc id="desc">An NPD-adapted model learns from Equinor with optional NPD replay. Results compare retention and adaptation on fixed test sets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="replay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087f70"/></marker>
  </defs>
  <rect width="1440" height="810" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="66" font-size="18" font-weight="700" fill="#2563eb">ENGLISH-NORWEGIAN PETROLEUM TRANSLATION</text>
    <text x="64" y="124" font-size="42" font-weight="700" fill="#17202b">Replay-based continual adaptation</text>
    <text x="64" y="164" font-size="22" fill="#566273">Learning from Equinor data while retaining performance on NPD</text>
    <line x1="64" y1="196" x2="1376" y2="196" stroke="#d8e0e8"/>
    <text x="64" y="242" font-size="18" font-weight="700" fill="#566273">01 / SOURCE UPDATE</text>
    <rect x="64" y="274" width="320" height="132" rx="8" fill="#eff6ff" stroke="#a9c7f5"/>
    <text x="88" y="311" font-size="18" fill="#2563eb">INITIAL MODEL</text>
    <text x="88" y="348" font-size="26" font-weight="700" fill="#17202b">NPD-adapted model</text>
    <text x="88" y="382" font-size="19" fill="#566273">NLLB-200 distilled 600M + LoRA</text>
    <path d="M398 340 H527" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="464" y="318" text-anchor="middle" font-size="16" fill="#566273">continue training</text>
    <rect x="544" y="274" width="352" height="132" rx="8" fill="#ffffff" stroke="#aab6c4"/>
    <text x="568" y="311" font-size="18" fill="#566273">UPDATE DATA</text>
    <text x="568" y="348" font-size="26" font-weight="700" fill="#17202b">Equinor corpus</text>
    <text x="568" y="382" font-size="20" fill="#566273">With or without NPD replay</text>
    <path d="M910 340 H1039" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1056" y="274" width="320" height="132" rx="8" fill="#ffffff" stroke="#aab6c4"/>
    <text x="1080" y="311" font-size="18" fill="#566273">EVALUATION</text>
    <text x="1080" y="348" font-size="26" font-weight="700" fill="#17202b">Fixed test sets</text>
    <text x="1080" y="382" font-size="19" fill="#566273">NPD retention + Equinor gain</text>
    <path d="M224 418 V458 H720 V418" fill="none" stroke="#087f70" stroke-width="3" marker-end="url(#replay)"/>
    <rect x="300" y="440" width="346" height="34" fill="#f8fafc"/>
    <text x="473" y="464" text-anchor="middle" font-size="19" font-weight="700" fill="#087f70">Replay: 5% or 10% NPD data</text>
    <text x="64" y="522" font-size="18" font-weight="700" fill="#566273">02 / RETENTION AND ADAPTATION</text>
    <text x="1376" y="522" text-anchor="end" font-size="18" fill="#566273">BLEU on fixed test sets</text>
    <text x="88" y="566" font-size="19" fill="#566273">Update strategy</text>
    <text x="934" y="566" text-anchor="end" font-size="19" fill="#566273">NPD</text>
    <text x="1320" y="566" text-anchor="end" font-size="19" fill="#566273">Equinor</text>
    <line x1="64" y1="582" x2="1376" y2="582" stroke="#d8e0e8"/>
    <text x="88" y="616" font-size="22" fill="#17202b">Continual adaptation / no replay</text>
    <text x="934" y="616" text-anchor="end" font-size="25" fill="#17202b">54.73</text>
    <text x="1320" y="616" text-anchor="end" font-size="25" font-weight="700" fill="#2563eb">42.72</text>
    <line x1="64" y1="635" x2="1376" y2="635" stroke="#e3e8ee"/>
    <text x="88" y="669" font-size="22" fill="#17202b">Continual adaptation + 5% replay</text>
    <text x="934" y="669" text-anchor="end" font-size="25" fill="#17202b">58.21</text>
    <text x="1320" y="669" text-anchor="end" font-size="25" fill="#17202b">42.11</text>
    <rect x="64" y="688" width="1312" height="53" rx="4" fill="#e6f4ee"/>
    <text x="88" y="722" font-size="22" font-weight="700" fill="#087f70">Continual adaptation + 10% replay</text>
    <text x="934" y="722" text-anchor="end" font-size="25" font-weight="700" fill="#087f70">59.22</text>
    <text x="1320" y="722" text-anchor="end" font-size="25" fill="#17202b">41.85</text>
    <text x="64" y="781" font-size="18" fill="#566273">27 trained adapters / 3 random seeds</text>
    <text x="1376" y="781" text-anchor="end" font-size="18" fill="#566273">Evaluation: BLEU / chrF / terminology metrics</text>
  </g>
</svg>

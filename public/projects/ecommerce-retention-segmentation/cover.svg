<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">E-commerce customer retention and segmentation</title>
  <desc id="desc">A dark blue dashboard illustration showing cohort retention bars and four RFM customer segments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/><stop offset="1" stop-color="#123a5a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="85" r="170" fill="#38bdf8" opacity=".08"/>
  <text x="72" y="86" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">CUSTOMER ANALYTICS</text>
  <text x="72" y="145" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="750">Retention &amp; Segmentation</text>
  <text x="72" y="184" fill="#a8c4d8" font-family="Inter,Arial,sans-serif" font-size="22">Cohorts · RFM scoring · KMeans</text>
  <rect x="72" y="224" width="672" height="365" rx="24" fill="#0c213b" stroke="#28506c"/>
  <text x="110" y="270" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">AVERAGE COHORT RETENTION</text>
  <line x1="112" y1="514" x2="692" y2="514" stroke="#31526a" stroke-width="2"/>
  <g fill="url(#bar)">
    <rect x="138" y="375" width="82" height="139" rx="9"/><rect x="280" y="358" width="82" height="156" rx="9"/>
    <rect x="422" y="350" width="82" height="164" rx="9"/><rect x="564" y="335" width="82" height="179" rx="9"/>
  </g>
  <g fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="179" y="359">20.6%</text><text x="321" y="342">23.2%</text><text x="463" y="334">24.4%</text><text x="605" y="319">26.6%</text>
  </g>
  <g fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="17" text-anchor="middle">
    <text x="179" y="548">Month 1</text><text x="321" y="548">Month 3</text><text x="463" y="548">Month 6</text><text x="605" y="548">Month 12</text>
  </g>
  <rect x="780" y="224" width="348" height="365" rx="24" fill="#0c213b" stroke="#28506c"/>
  <text x="818" y="270" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">RFM SIGNALS</text>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="837" cy="324" r="11" fill="#38bdf8"/><text x="864" y="332" fill="#e5f3fb" font-size="20">Recency</text>
    <circle cx="837" cy="378" r="11" fill="#2dd4bf"/><text x="864" y="386" fill="#e5f3fb" font-size="20">Frequency</text>
    <circle cx="837" cy="432" r="11" fill="#fbbf24"/><text x="864" y="440" fill="#e5f3fb" font-size="20">Monetary value</text>
  </g>
  <rect x="818" y="478" width="271" height="72" rx="16" fill="#123652"/>
  <text x="953" y="508" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">CLEAN ANALYSIS TABLE</text>
  <text x="953" y="535" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="750" text-anchor="middle">392,692 rows</text>
  <text x="72" y="633" fill="#7f9eb5" font-family="Inter,Arial,sans-serif" font-size="16">Portfolio case study · verified from saved notebook outputs</text>
</svg>

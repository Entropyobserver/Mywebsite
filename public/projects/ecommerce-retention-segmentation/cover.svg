<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Customer segmentation and lifecycle analysis</title><desc id="desc">Five customer segments derived from 4,335 customers with K-Means and future behavior validation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152d"/><stop offset="1" stop-color="#123a5a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/><circle cx="1100" cy="30" r="210" fill="#38bdf8" opacity=".07"/>
  <text x="72" y="82" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">CUSTOMER ANALYTICS</text><text x="72" y="145" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="750">Segmentation &amp; Lifecycle Analysis</text><text x="72" y="187" fill="#a8c4d8" font-family="Inter,Arial,sans-serif" font-size="22">K-Means · Hierarchical clustering · Future validation</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="72" y="230" width="280" height="112" rx="20" fill="#0c213b" stroke="#28506c"/><text x="100" y="268" fill="#91afc3" font-size="16">CUSTOMERS</text><text x="100" y="316" fill="#fff" font-size="40" font-weight="750">4,335</text><rect x="372" y="230" width="280" height="112" rx="20" fill="#0c213b" stroke="#28506c"/><text x="400" y="268" fill="#91afc3" font-size="16">STABILITY ARI</text><text x="400" y="316" fill="#fff" font-size="40" font-weight="750">0.974</text></g>
  <rect x="72" y="374" width="1056" height="210" rx="24" fill="#0c213b" stroke="#28506c"/><text x="104" y="415" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">FIVE OPERATIONAL SEGMENTS · NEXT-90-DAY REPURCHASE</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><circle cx="184" cy="491" r="45" fill="#22c55e"/><text x="184" y="487" fill="#052e16" font-size="20" font-weight="800">87.1%</text><text x="184" y="511" fill="#052e16" font-size="12">LOYAL</text><circle cx="388" cy="491" r="45" fill="#38bdf8"/><text x="388" y="487" fill="#082f49" font-size="20" font-weight="800">60.4%</text><text x="388" y="511" fill="#082f49" font-size="12">STABLE</text><circle cx="592" cy="491" r="45" fill="#a78bfa"/><text x="592" y="487" fill="#2e1065" font-size="20" font-weight="800">48.6%</text><text x="592" y="511" fill="#2e1065" font-size="12">NEW</text><circle cx="796" cy="491" r="45" fill="#fbbf24"/><text x="796" y="487" fill="#422006" font-size="20" font-weight="800">35.3%</text><text x="796" y="511" fill="#422006" font-size="12">CANCEL</text><circle cx="1000" cy="491" r="45" fill="#fb7185"/><text x="1000" y="487" fill="#4c0519" font-size="20" font-weight="800">27.9%</text><text x="1000" y="511" fill="#4c0519" font-size="12">DORMANT</text></g>

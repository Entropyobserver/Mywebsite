<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Clustering algorithm comparison</title><desc id="desc">Comparison of K-Means, Ward hierarchical clustering, Gaussian Mixture, and HDBSCAN.</desc><rect width="1200" height="675" rx="28" fill="#07152d"/><text x="70" y="78" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">Q3 · ALGORITHM COMPARISON</text><text x="70" y="132" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">The same features produce different operating trade-offs</text>
  <g font-family="Inter,Arial,sans-serif"><text x="80" y="205" fill="#91afc3" font-size="15">METHOD</text><text x="500" y="205" fill="#91afc3" font-size="15">SILHOUETTE</text><text x="720" y="205" fill="#91afc3" font-size="15">SMALLEST GROUP</text><text x="970" y="205" fill="#91afc3" font-size="15">NOISE</text><rect x="65" y="225" width="1070" height="78" rx="16" fill="#123652" stroke="#38bdf8"/><text x="90" y="273" fill="#fff" font-size="22" font-weight="750">K-Means</text><text x="535" y="273" fill="#2dd4bf" font-size="24" font-weight="750">0.225</text><text x="775" y="273" fill="#fff" font-size="22">9.5%</text><text x="1005" y="273" fill="#fff" font-size="22">0%</text><rect x="65" y="320" width="1070" height="78" rx="16" fill="#0c213b" stroke="#28506c"/><text x="90" y="368" fill="#fff" font-size="22">Ward hierarchical</text><text x="535" y="368" fill="#fff" font-size="22">0.212</text><text x="775" y="368" fill="#fbbf24" font-size="22" font-weight="750">1.6%</text><text x="1005" y="368" fill="#fff" font-size="22">0%</text><rect x="65" y="415" width="1070" height="78" rx="16" fill="#0c213b" stroke="#28506c"/><text x="90" y="463" fill="#fff" font-size="22">Gaussian Mixture</text><text x="535" y="463" fill="#fff" font-size="22">0.154</text><text x="775" y="463" fill="#fff" font-size="22">9.1%</text><text x="1005" y="463" fill="#fff" font-size="22">0%</text><rect x="65" y="510" width="1070" height="78" rx="16" fill="#0c213b" stroke="#28506c"/><text x="90" y="558" fill="#fff" font-size="22">HDBSCAN</text><text x="535" y="558" fill="#fff" font-size="22">0.259*</text><text x="775" y="558" fill="#fff" font-size="22">8.9%*</text><text x="1005" y="558" fill="#fb7185" font-size="22" font-weight="750">68.3%</text></g><text x="70" y="630" fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="16">*HDBSCAN metrics exclude customers labelled as noise. K-Means is selected for stable, complete assignment.</text></svg>

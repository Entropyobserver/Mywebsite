<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">From transaction lines to customer features</title><desc id="desc">A four-step pipeline from 1,067,371 raw lines to 4,335 customers and 15 features.</desc><rect width="1200" height="675" rx="28" fill="#07152d"/><text x="70" y="82" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">Q1 · DATA READINESS</text><text x="70" y="137" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">Transactions become a point-in-time customer table</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="70" y="220" width="235" height="245" rx="22" fill="#0c213b" stroke="#28506c"/><text x="100" y="262" fill="#91afc3" font-size="15">RAW SOURCE</text><text x="100" y="320" fill="#fff" font-size="34" font-weight="750">1,067,371</text><text x="100" y="350" fill="#a8c4d8" font-size="18">transaction lines</text><text x="100" y="405" fill="#7dd3fc" font-size="16">2 annual sheets</text><text x="100" y="432" fill="#7dd3fc" font-size="16">5,942 IDs</text><rect x="370" y="220" width="235" height="245" rx="22" fill="#0c213b" stroke="#28506c"/><text x="400" y="262" fill="#91afc3" font-size="15">QUALITY RULES</text><text x="400" y="310" fill="#fff" font-size="21" font-weight="700">Positive quantity</text><text x="400" y="348" fill="#fff" font-size="21" font-weight="700">Positive price</text><text x="400" y="386" fill="#fff" font-size="21" font-weight="700">Known customer ID</text><text x="400" y="424" fill="#fbbf24" font-size="17">Cancellations retained</text><rect x="670" y="220" width="235" height="245" rx="22" fill="#0c213b" stroke="#28506c"/><text x="700" y="262" fill="#91afc3" font-size="15">365-DAY WINDOW</text><text x="700" y="310" fill="#fff" font-size="20" font-weight="700">Value &amp; frequency</text><text x="700" y="346" fill="#fff" font-size="20" font-weight="700">Lifecycle &amp; cadence</text><text x="700" y="382" fill="#fff" font-size="20" font-weight="700">Breadth &amp; trend</text><text x="700" y="418" fill="#fff" font-size="20" font-weight="700">Cancellation signals</text><rect x="970" y="220" width="160" height="245" rx="22" fill="#123652" stroke="#38bdf8"/><text x="1050" y="270" text-anchor="middle" fill="#7dd3fc" font-size="15">FINAL TABLE</text><text x="1050" y="330" text-anchor="middle" fill="#fff" font-size="31" font-weight="750">4,335</text><text x="1050" y="360" text-anchor="middle" fill="#a8c4d8" font-size="16">customers</text><text x="1050" y="410" text-anchor="middle" fill="#2dd4bf" font-size="31" font-weight="750">15</text><text x="1050" y="438" text-anchor="middle" fill="#a8c4d8" font-size="16">features</text></g>
  <path d="M315 342H355M615 342H655M915 342H955" stroke="#38bdf8" stroke-width="5"/><path d="M345 332l12 10-12 10M645 332l12 10-12 10M945 332l12 10-12 10" fill="none" stroke="#38bdf8" stroke-width="4"/><rect x="70" y="520" width="1060" height="76" rx="18" fill="#0c213b"/><text x="600" y="553" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Future 90 days are held out from clustering</text><text x="600" y="580" text-anchor="middle" fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="15">They are used only to validate whether the historical segments behave differently later.</text></svg>

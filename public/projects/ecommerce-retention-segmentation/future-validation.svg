<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Future 90-day repurchase validation</title><desc id="desc">Repurchase rates range from 87.1 percent for high-value loyal customers to 27.9 percent for dormant-risk customers.</desc><rect width="1200" height="675" rx="28" fill="#07152d"/><text x="70" y="78" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">Q5 · FUTURE VALIDATION</text><text x="70" y="132" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">Historical segments predict different future behavior</text><rect x="70" y="180" width="1060" height="405" rx="22" fill="#0c213b" stroke="#28506c"/>
  <g font-family="Inter,Arial,sans-serif" font-size="18" fill="#dbeafe"><text x="95" y="250">High-value loyal</text><text x="95" y="315">Stable repeat</text><text x="95" y="380">New / high-potential</text><text x="95" y="445">High-cancellation / low</text><text x="95" y="510">Dormant risk</text></g><g><rect x="350" y="224" width="653" height="34" rx="9" fill="#22c55e"/><rect x="350" y="289" width="453" height="34" rx="9" fill="#38bdf8"/><rect x="350" y="354" width="365" height="34" rx="9" fill="#a78bfa"/><rect x="350" y="419" width="265" height="34" rx="9" fill="#fbbf24"/><rect x="350" y="484" width="209" height="34" rx="9" fill="#fb7185"/></g><g font-family="Inter,Arial,sans-serif" font-size="20" font-weight="750" fill="#fff"><text x="1020" y="250">87.1%</text><text x="820" y="315">60.4%</text><text x="732" y="380">48.6%</text><text x="632" y="445">35.3%</text><text x="576" y="510">27.9%</text></g><text x="350" y="552" fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="15">0%</text><text x="725" y="552" fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="15">50%</text><text x="1080" y="552" fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="15">100%</text><text x="70" y="625" fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="16">Future purchases were excluded from clustering. Association supports prioritization; causal lift still requires an experiment.</text></svg>

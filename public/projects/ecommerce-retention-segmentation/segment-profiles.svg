<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Five customer segment profiles</title><desc id="desc">Five operational customer groups with size and selected historical medians.</desc><rect width="1200" height="675" rx="28" fill="#07152d"/><text x="70" y="78" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">Q4 · SEGMENT PROFILES</text><text x="70" y="132" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">Five groups, named from auditable behavior</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="65" y="190" width="330" height="165" rx="20" fill="#0c213b" stroke="#22c55e"/><text x="90" y="230" fill="#22c55e" font-size="18" font-weight="750">HIGH-VALUE LOYAL</text><text x="90" y="275" fill="#fff" font-size="30" font-weight="750">743 customers</text><text x="90" y="310" fill="#a8c4d8" font-size="17">Median spend £3,828 · 9 orders</text><text x="90" y="337" fill="#a8c4d8" font-size="17">Recency 26 days</text><rect x="435" y="190" width="330" height="165" rx="20" fill="#0c213b" stroke="#38bdf8"/><text x="460" y="230" fill="#38bdf8" font-size="18" font-weight="750">STABLE REPEAT</text><text x="460" y="275" fill="#fff" font-size="30" font-weight="750">1,160 customers</text><text x="460" y="310" fill="#a8c4d8" font-size="17">Median spend £1,107 · 3 orders</text><text x="460" y="337" fill="#a8c4d8" font-size="17">Recency 64 days</text><rect x="805" y="190" width="330" height="165" rx="20" fill="#0c213b" stroke="#a78bfa"/><text x="830" y="230" fill="#a78bfa" font-size="18" font-weight="750">NEW / HIGH-POTENTIAL</text><text x="830" y="275" fill="#fff" font-size="30" font-weight="750">428 customers</text><text x="830" y="310" fill="#a8c4d8" font-size="17">Tenure 64 days · 1 order</text><text x="830" y="337" fill="#a8c4d8" font-size="17">Recent-spend share 100%</text><rect x="250" y="390" width="330" height="165" rx="20" fill="#0c213b" stroke="#fbbf24"/><text x="275" y="430" fill="#fbbf24" font-size="18" font-weight="750">HIGH-CANCELLATION / LOW</text><text x="275" y="475" fill="#fff" font-size="30" font-weight="750">411 customers</text><text x="275" y="510" fill="#a8c4d8" font-size="17">Median cancellation rate 50%</text><text x="275" y="537" fill="#a8c4d8" font-size="17">Recency 231 days</text><rect x="620" y="390" width="330" height="165" rx="20" fill="#0c213b" stroke="#fb7185"/><text x="645" y="430" fill="#fb7185" font-size="18" font-weight="750">DORMANT RISK</text><text x="645" y="475" fill="#fff" font-size="30" font-weight="750">1,593 customers</text><text x="645" y="510" fill="#a8c4d8" font-size="17">Largest group · 36.7%</text><text x="645" y="537" fill="#a8c4d8" font-size="17">Recency 276 days</text></g><text x="70" y="625" fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="16">Names summarize relative profiles; they are operational labels, not model-discovered personalities.</text></svg>

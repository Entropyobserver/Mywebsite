<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">K-Means cluster-count selection</title><desc id="desc">Metrics for two through eight clusters, highlighting the selected five-cluster solution.</desc><rect width="1200" height="675" rx="28" fill="#07152d"/><text x="70" y="78" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">Q2 · CLUSTER COUNT</text><text x="70" y="132" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="750">Five clusters balance stability and usability</text><rect x="70" y="185" width="760" height="390" rx="22" fill="#0c213b" stroke="#28506c"/>
  <g stroke="#31526a"><path d="M145 500H770"/><path d="M145 420H770"/><path d="M145 340H770"/><path d="M145 260H770"/></g><g fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="14"><text x="105" y="505">0.15</text><text x="105" y="425">0.20</text><text x="105" y="345">0.25</text><text x="105" y="265">0.30</text></g><polyline points="170,376 265,309 360,422 455,381 550,427 645,416 740,413" fill="none" stroke="#38bdf8" stroke-width="5"/><g fill="#38bdf8"><circle cx="170" cy="376" r="7"/><circle cx="265" cy="309" r="7"/><circle cx="360" cy="422" r="7"/><circle cx="455" cy="381" r="11" fill="#2dd4bf"/><circle cx="550" cy="427" r="7"/><circle cx="645" cy="416" r="7"/><circle cx="740" cy="413" r="7"/></g><g fill="#a8c4d8" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle"><text x="170" y="535">2</text><text x="265" y="535">3</text><text x="360" y="535">4</text><text x="455" y="535" fill="#2dd4bf" font-weight="800">5</text><text x="550" y="535">6</text><text x="645" y="535">7</text><text x="740" y="535">8</text></g><text x="455" y="350" text-anchor="middle" fill="#2dd4bf" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">SELECTED</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="870" y="185" width="260" height="114" rx="20" fill="#0c213b" stroke="#28506c"/><text x="900" y="224" fill="#91afc3" font-size="15">STABILITY ARI</text><text x="900" y="274" fill="#fff" font-size="38" font-weight="750">0.974</text><rect x="870" y="319" width="260" height="114" rx="20" fill="#0c213b" stroke="#28506c"/><text x="900" y="358" fill="#91afc3" font-size="15">MINIMUM SHARE</text><text x="900" y="408" fill="#fff" font-size="38" font-weight="750">9.5%</text><rect x="870" y="453" width="260" height="122" rx="20" fill="#0c213b" stroke="#28506c"/><text x="900" y="492" fill="#91afc3" font-size="15">SILHOUETTE</text><text x="900" y="542" fill="#fff" font-size="38" font-weight="750">0.225</text></g><text x="70" y="625" fill="#91afc3" font-family="Inter,Arial,sans-serif" font-size="17">Modest separation is reported explicitly: this is an operational grouping, not proof of five natural types.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Evidence boundary for bias claims</title>
  <desc id="desc">A staged process from automatic screening through human agreement to qualified reporting.</desc>
  <rect width="1200" height="650" rx="22" fill="#F8FAFC"/>
  <text x="54" y="66" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">From signal to defensible claim</text>
  <text x="54" y="99" fill="#64748B" font-family="Inter,Arial,sans-serif" font-size="17">Each stage answers a different question and narrows what can responsibly be reported.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(54 155)"><rect width="255" height="320" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="26" y="45" fill="#B45309" font-size="14" font-weight="700">STAGE 1</text><text x="26" y="91" fill="#0F172A" font-size="24" font-weight="700">Screen</text><text x="26" y="133" fill="#475569" font-size="16">Do group-level metrics</text><text x="26" y="159" fill="#475569" font-size="16">show a repeatable gap?</text><path d="M26 202h203" stroke="#FCD34D"/><text x="26" y="239" fill="#0F172A" font-size="15" font-weight="600">Outputs</text><text x="26" y="268" fill="#475569" font-size="14">effect sizes</text><text x="26" y="293" fill="#475569" font-size="14">bootstrap intervals</text></g>
    <path d="M321 315h54m-13-11 13 11-13 11" fill="none" stroke="#64748B" stroke-width="2"/>
    <g transform="translate(387 155)"><rect width="255" height="320" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/><text x="26" y="45" fill="#0369A1" font-size="14" font-weight="700">STAGE 2</text><text x="26" y="91" fill="#0F172A" font-size="24" font-weight="700">Annotate</text><text x="26" y="133" fill="#475569" font-size="16">Does the apparent gap</text><text x="26" y="159" fill="#475569" font-size="16">survive human review?</text><path d="M26 202h203" stroke="#7DD3FC"/><text x="26" y="239" fill="#0F172A" font-size="15" font-weight="600">Outputs</text><text x="26" y="268" fill="#475569" font-size="14">coded examples</text><text x="26" y="293" fill="#475569" font-size="14">context + severity</text></g>
    <path d="M654 315h54m-13-11 13 11-13 11" fill="none" stroke="#64748B" stroke-width="2"/>
    <g transform="translate(720 155)"><rect width="255" height="320" rx="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="26" y="45" fill="#6D28D9" font-size="14" font-weight="700">STAGE 3</text><text x="26" y="91" fill="#0F172A" font-size="24" font-weight="700">Calibrate</text><text x="26" y="133" fill="#475569" font-size="16">Can reviewers apply the</text><text x="26" y="159" fill="#475569" font-size="16">scheme consistently?</text><path d="M26 202h203" stroke="#C4B5FD"/><text x="26" y="239" fill="#0F172A" font-size="15" font-weight="600">Outputs</text><text x="26" y="268" fill="#475569" font-size="14">Cohen's kappa</text><text x="26" y="293" fill="#475569" font-size="14">guideline revisions</text></g>
    <path d="M987 315h54m-13-11 13 11-13 11" fill="none" stroke="#64748B" stroke-width="2"/>
    <g transform="translate(1053 155)"><rect width="93" height="320" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="18" y="45" fill="#15803D" font-size="12" font-weight="700">04</text><text x="18" y="91" fill="#0F172A" font-size="20" font-weight="700">Report</text><text x="18" y="133" fill="#475569" font-size="13">scope</text><text x="18" y="159" fill="#475569" font-size="13">limits</text><text x="18" y="185" fill="#475569" font-size="13">evidence</text></g>
    <rect x="54" y="522" width="1092" height="74" rx="14" fill="#0F172A"/><text x="600" y="554" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700">VALIDATION BOUNDARY</text><text x="600" y="580" text-anchor="middle" fill="#94A3B8" font-size="14">Metric differences are screening evidence—not a standalone diagnosis of bias.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Conversion lift from advertising</title><desc id="desc">Ad conversion was 2.555 percent versus 1.785 percent for PSA, an absolute lift of 0.769 percentage points.</desc>
  <rect width="1200" height="650" rx="28" fill="#0b1020"/><g font-family="Arial"><text x="70" y="75" fill="#f8fafc" font-size="32" font-weight="700">Does advertising increase conversion?</text>
  <line x1="100" y1="520" x2="720" y2="520" stroke="#334155" stroke-width="2"/><rect x="190" y="202" width="175" height="318" rx="14" fill="#7c3aed"/><rect x="470" y="298" width="175" height="222" rx="14" fill="#94a3b8"/><text x="277" y="180" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">2.555%</text><text x="557" y="276" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">1.785%</text><text x="277" y="560" text-anchor="middle" fill="#c4b5fd" font-size="22">AD</text><text x="557" y="560" text-anchor="middle" fill="#cbd5e1" font-size="22">PSA</text>
  <rect x="770" y="155" width="360" height="300" rx="24" fill="#151d33"/><text x="810" y="210" fill="#a5b4fc" font-size="18">ABSOLUTE LIFT</text><text x="810" y="275" fill="#4ade80" font-size="50" font-weight="700">+0.769 pp</text><text x="810" y="330" fill="#e2e8f0" font-size="20">95% CI</text><text x="810" y="367" fill="#fff" font-size="26" font-weight="700">+0.595 to +0.943 pp</text><text x="810" y="415" fill="#94a3b8" font-size="18">Relative lift: +43.1%</text>
  <text x="70" y="615" fill="#94a3b8" font-size="18">Absolute lift is the decision-relevant measure when the baseline conversion rate is low.</text></g>
</svg>

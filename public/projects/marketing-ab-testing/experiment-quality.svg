<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Experiment data quality and allocation</title><desc id="desc">588101 unique users, no missing or duplicate records, with 96 percent in ad and 4 percent in PSA.</desc>
  <rect width="1200" height="650" rx="28" fill="#0b1020"/><text x="70" y="75" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">Is the experiment data analysis-ready?</text>
  <g font-family="Arial"><rect x="70" y="120" width="310" height="170" rx="20" fill="#151d33"/><text x="100" y="170" fill="#a5b4fc" font-size="18">UNIQUE USERS</text><text x="100" y="230" fill="#fff" font-size="48" font-weight="700">588,101</text><text x="100" y="265" fill="#94a3b8" font-size="17">one row per user</text>
  <rect x="405" y="120" width="310" height="170" rx="20" fill="#151d33"/><text x="435" y="170" fill="#a5b4fc" font-size="18">MISSING CELLS</text><text x="435" y="230" fill="#4ade80" font-size="48" font-weight="700">0</text><text x="435" y="265" fill="#94a3b8" font-size="17">complete analytical fields</text>
  <rect x="740" y="120" width="390" height="170" rx="20" fill="#151d33"/><text x="770" y="170" fill="#a5b4fc" font-size="18">DUPLICATE USERS / ROWS</text><text x="770" y="230" fill="#4ade80" font-size="48" font-weight="700">0 / 0</text><text x="770" y="265" fill="#94a3b8" font-size="17">clean analysis unit</text>
  <text x="70" y="365" fill="#f8fafc" font-size="23" font-weight="700">Observed allocation</text><rect x="70" y="395" width="1018" height="72" rx="16" fill="#7c3aed"/><rect x="1088" y="395" width="42" height="72" rx="12" fill="#94a3b8"/><text x="95" y="440" fill="#fff" font-size="24" font-weight="700">AD 96.0%</text><text x="985" y="500" fill="#cbd5e1" font-size="18">PSA 4.0%</text>
  <rect x="70" y="540" width="1060" height="55" rx="14" fill="#291c3e"/><text x="95" y="574" fill="#e9d5ff" font-size="19">Decision gate: verify the planned allocation and assignment logs before rollout.</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Statistical evidence and commercial decision inputs</title><desc id="desc">Strong statistical evidence is balanced against a small standardized effect and missing unit economics.</desc>
  <rect width="1200" height="650" rx="28" fill="#0b1020"/><g font-family="Arial"><text x="70" y="75" fill="#f8fafc" font-size="32" font-weight="700">Is the result statistically and commercially meaningful?</text>
  <rect x="70" y="125" width="500" height="385" rx="24" fill="#151d33"/><text x="110" y="180" fill="#a5b4fc" font-size="20" font-weight="700">STATISTICAL EVIDENCE</text><text x="110" y="250" fill="#fff" font-size="26">Two-proportion z</text><text x="500" y="250" text-anchor="end" fill="#4ade80" font-size="34" font-weight="700">7.37</text><text x="110" y="320" fill="#fff" font-size="26">p-value</text><text x="500" y="320" text-anchor="end" fill="#4ade80" font-size="34" font-weight="700">1.71e-13</text><text x="110" y="390" fill="#fff" font-size="26">Cohen's h</text><text x="500" y="390" text-anchor="end" fill="#fbbf24" font-size="34" font-weight="700">0.053</text><text x="110" y="450" fill="#94a3b8" font-size="18">Strong evidence, small standardized effect</text>
  <rect x="610" y="125" width="520" height="385" rx="24" fill="#151d33"/><text x="650" y="180" fill="#a5b4fc" font-size="20" font-weight="700">BUSINESS DECISION</text><text x="650" y="245" fill="#fff" font-size="27" font-weight="700">~130 users</text><text x="650" y="280" fill="#94a3b8" font-size="18">per extra conversion at observed lift</text><line x1="650" y1="320" x2="1080" y2="320" stroke="#334155"/><text x="650" y="365" fill="#f8fafc" font-size="21">Still required:</text><text x="675" y="405" fill="#cbd5e1" font-size="19">• value per conversion</text><text x="675" y="440" fill="#cbd5e1" font-size="19">• advertising cost</text><text x="675" y="475" fill="#cbd5e1" font-size="19">• guardrail metrics</text>
  <rect x="70" y="555" width="1060" height="52" rx="14" fill="#291c3e"/><text x="95" y="588" fill="#e9d5ff" font-size="19">A small p-value supports an effect; it does not establish positive ROI.</text></g>
</svg>

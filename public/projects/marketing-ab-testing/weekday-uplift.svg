<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Exploratory conversion lift by weekday</title><desc id="desc">Tuesday has the largest observed lift. Sunday and Thursday are not significant after Benjamini-Hochberg correction.</desc>
  <rect width="1200" height="650" rx="28" fill="#0b1020"/><g font-family="Arial"><text x="70" y="70" fill="#f8fafc" font-size="32" font-weight="700">Do results vary by weekday?</text><text x="70" y="110" fill="#94a3b8" font-size="18">Absolute conversion lift (percentage points), exploratory slices</text>
  <g font-size="18" fill="#e2e8f0"><text x="80" y="175">Tuesday</text><text x="80" y="235">Monday</text><text x="80" y="295">Wednesday</text><text x="80" y="355">Saturday</text><text x="80" y="415">Friday</text><text x="80" y="475">Sunday</text><text x="80" y="535">Thursday</text></g>
  <g fill="#7c3aed"><rect x="215" y="148" width="704" height="32" rx="8"/><rect x="215" y="208" width="470" height="32" rx="8"/><rect x="215" y="268" width="422" height="32" rx="8"/><rect x="215" y="328" width="322" height="32" rx="8"/><rect x="215" y="388" width="271" height="32" rx="8"/></g><g fill="#64748b"><rect x="215" y="448" width="177" height="32" rx="8"/><rect x="215" y="508" width="62" height="32" rx="8"/></g>
  <g font-size="18" font-weight="700"><text x="935" y="173" fill="#4ade80">+1.60 pp ✓</text><text x="700" y="233" fill="#4ade80">+1.07 pp ✓</text><text x="652" y="293" fill="#4ade80">+0.96 pp ✓</text><text x="552" y="353" fill="#4ade80">+0.73 pp ✓</text><text x="501" y="413" fill="#4ade80">+0.62 pp ✓</text><text x="407" y="473" fill="#94a3b8">+0.40 pp</text><text x="292" y="533" fill="#94a3b8">+0.14 pp</text></g>
  <rect x="70" y="580" width="1060" height="45" rx="12" fill="#151d33"/><text x="92" y="609" fill="#cbd5e1" font-size="17">✓ significant after BH correction · Use these patterns to design a pre-registered timing experiment.</text></g>
</svg>
